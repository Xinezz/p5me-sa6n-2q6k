<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>JavaScript Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Pixelify+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a station maintenance console. Sticky status bar, a sector map wired like a circuit, and each lesson as a five-stage workbench. */
:root {
  --bg: #E7ECF0;
  --panel: #F7F9FA;
  --panel-2: #DCE3E9;
  --ink: #15202B;
  --muted: #53637A;
  --line: #C2CCD6;
  --accent: #B4580E;
  --accent-ink: #FFFFFF;
  --accent-soft: #F4E0CB;
  --signal: #0E6A74;
  --signal-soft: #D2E9EB;
  --ok: #1C7A4B;
  --ok-soft: #D5ECDE;
  --bad: #AF372F;
  --bad-soft: #F5D9D5;
  --code-bg: #131E29;
  --code-ink: #DCE6EE;
  --code-muted: #6C8195;
  --code-line: #1E2D3B;
  --code-hi: #24384A;
  --t-k: #F2A65A; --t-s: #A3D98F; --t-n: #F5CB74; --t-c: #6C8195; --t-f: #7CC7E8; --t-o: #E39BC4; --t-p: #A8B6C3; --t-op: #F08A7E;
  --f-display: "Pixelify Sans", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, Consolas, "Courier New", monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151C; --panel: #151F29; --panel-2: #1C2834; --ink: #E1E8EE; --muted: #92A2B3; --line: #293745;
    --accent: #F09F4E; --accent-ink: #1A1006; --accent-soft: #3A2814; --signal: #5CC2CB; --signal-soft: #15333A;
    --ok: #5BC98B; --ok-soft: #14301F; --bad: #F07B6F; --bad-soft: #3A1D1A;
    --code-bg: #0A1016; --code-line: #15202A; --code-hi: #1D2E3D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151C; --panel: #151F29; --panel-2: #1C2834; --ink: #E1E8EE; --muted: #92A2B3; --line: #293745;
  --accent: #F09F4E; --accent-ink: #1A1006; --accent-soft: #3A2814; --signal: #5CC2CB; --signal-soft: #15333A;
  --ok: #5BC98B; --ok-soft: #14301F; --bad: #F07B6F; --bad-soft: #3A1D1A;
  --code-bg: #0A1016; --code-line: #15202A; --code-hi: #1D2E3D;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: .01em; }
p { margin: 0; }
code { font-family: var(--f-code); font-size: .88em; background: var(--panel-2); padding: .08em .35em; border-radius: 4px; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: .5em 1em; border-radius: var(--r); font-weight: 700; display: inline-flex; align-items: center; gap: .45em; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.signal { background: var(--signal); border-color: var(--signal); color: var(--panel); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: .3em .7em; font-size: .9em; }
.eyebrow { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .12em; font-size: .75rem; color: var(--muted); font-weight: 600; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; background: none; border: 0; color: var(--ink); padding: 0; }
.logo-mark { width: 34px; height: 34px; border-radius: 6px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--f-code); font-weight: 600; font-size: 14px; }
.logo b { font-family: var(--f-display); font-size: 1.2rem; letter-spacing: .02em; }
.status { margin-left: auto; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; font-size: .9rem; }
.rank { font-family: var(--f-display); font-weight: 600; }
.xpbar { width: 140px; height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--accent); }
.tnum { font-variant-numeric: tabular-nums; }

main { padding-block: 24px 64px; }

/* Map */
.hero { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 24px; align-items: stretch; margin-bottom: 28px; }
.hero h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); margin: 6px 0 12px; }
.hero p.lede { max-width: 60ch; color: var(--muted); font-size: 1.05rem; margin-bottom: 18px; }
.hero-card { background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 18px; font-family: var(--f-code); font-size: .85rem; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.hero-card .row { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--code-line); padding-bottom: 6px; }
.hero-card .row span:first-child { color: var(--code-muted); }
.loop-strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 32px; }
.loop-strip div { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; min-width: 0; }
.loop-strip b { display: block; font-family: var(--f-display); font-size: .95rem; }
.loop-strip small { color: var(--muted); font-size: .82rem; line-height: 1.35; display: block; }
.sector { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 20px; padding-block: 20px; border-top: 1px solid var(--line); }
.sector h3 { font-size: 1.3rem; margin: 4px 0 6px; }
.sector p { color: var(--muted); font-size: .92rem; }
.nodes { display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch; position: relative; }
.node { position: relative; width: 210px; max-width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; color: var(--ink); display: flex; flex-direction: column; gap: 4px; }
.node:not(:last-child)::after { content: ""; position: absolute; right: -15px; top: 50%; width: 14px; height: 2px; background: var(--line); }
.node .lv { font-family: var(--f-code); font-size: .75rem; color: var(--muted); }
.node b { font-family: var(--f-display); font-size: 1.05rem; }
.node small { color: var(--muted); font-size: .85rem; }
.node .stars { margin-top: auto; padding-top: 6px; letter-spacing: 2px; color: var(--accent); font-size: .95rem; }
.node.available { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.node.done { border-color: var(--ok); }
.node.done:not(:last-child)::after { background: var(--ok); }
.node.locked { opacity: .55; cursor: not-allowed; }
.node:not(.locked):hover { transform: translateY(-1px); }
.pill { display: inline-block; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border-radius: 99px; background: var(--panel-2); color: var(--muted); width: fit-content; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.go { background: var(--accent-soft); color: var(--accent); }

/* Lesson */
.lesson-head { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 16px; flex-wrap: wrap; }
.lesson-head h2 { font-size: clamp(1.7rem, 3.5vw, 2.4rem); margin: 4px 0; }
.lesson-head .concept { color: var(--muted); }
.stages { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: 24px; }
.stage-tab { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: var(--r); padding: 8px 10px; text-align: left; display: flex; flex-direction: column; min-width: 0; }
.stage-tab span { font-family: var(--f-code); font-size: .72rem; }
.stage-tab b { font-family: var(--f-display); color: var(--ink); font-size: 1rem; }
.stage-tab.active { border-color: var(--ink); background: var(--ink); }
.stage-tab.active b, .stage-tab.active span { color: var(--bg); }
.stage-tab.ok b::after { content: " ✓"; color: var(--ok); }
.stage-tab.active.ok b::after { color: var(--bg); }
.stage-tab:disabled { opacity: .5; cursor: not-allowed; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; min-width: 0; }
.panel h3 { font-size: 1.15rem; margin-bottom: 10px; }
.panel h4 { font-size: .95rem; margin-bottom: 6px; }
.prose { max-width: 68ch; display: flex; flex-direction: column; gap: 10px; }
.prose h3 { font-size: 1.25rem; margin-top: 8px; }
.brief { border-left: 3px solid var(--signal); background: var(--signal-soft); padding: 12px 16px; border-radius: 0 var(--r) var(--r) 0; }
.brief .eyebrow { color: var(--signal); }
.terms { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; }
.terms dt { font-weight: 700; }
.terms dd { margin: 0; color: var(--muted); }
table.explain { width: 100%; border-collapse: collapse; font-size: .93rem; }
table.explain td { border-top: 1px solid var(--line); padding: 8px 10px; vertical-align: top; }
table.explain td:first-child { white-space: pre; font-family: var(--f-code); font-size: .84rem; background: var(--code-bg); color: var(--code-ink); width: 1%; }
.scroll-x { overflow-x: auto; max-width: 100%; }
.compare { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.compare > div { border-radius: 8px; padding: 12px; min-width: 0; }
.compare .good { background: var(--ok-soft); }
.compare .bad { background: var(--bad-soft); }
.compare .tag { font-family: var(--f-display); font-weight: 700; font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; }
.compare .good .tag { color: var(--ok); }
.compare .bad .tag { color: var(--bad); }
.compare p { font-size: .9rem; margin-top: 8px; }
ul.mistakes { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.next-row { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 8px; }

/* Code */
pre.code { margin: 0; background: var(--code-bg); color: var(--code-ink); font-family: var(--f-code); font-size: .88rem; line-height: 1.6; padding: 12px 14px; border-radius: 8px; overflow-x: auto; white-space: pre; }
.k { color: var(--t-k); } .s { color: var(--t-s); } .n { color: var(--t-n); } .c { color: var(--t-c); font-style: italic; } .f { color: var(--t-f); } .o { color: var(--t-o); } .p { color: var(--t-p); } .op { color: var(--t-op); }

/* Editor */
.editor { display: flex; background: var(--code-bg); border-radius: 8px; overflow: auto; max-height: 460px; border: 1px solid var(--code-line); }
.gutter { position: sticky; left: 0; z-index: 2; background: var(--code-bg); border-right: 1px solid var(--code-line); padding: 12px 8px 12px 10px; font-family: var(--f-code); font-size: .88rem; line-height: 1.6; color: var(--code-muted); text-align: right; user-select: none; display: flex; flex-direction: column; min-width: 2.6em; }
.gutter span.err { color: var(--code-bg); background: var(--t-op); border-radius: 3px; padding-inline: 3px; }
.ed-wrap { position: relative; flex: 1; min-width: 0; display: inline-block; }
.ed-hl, .ed-ta { margin: 0; padding: 12px 14px; font-family: var(--f-code); font-size: .88rem; line-height: 1.6; white-space: pre; tab-size: 2; letter-spacing: 0; word-spacing: 0; border: 0; }
.ed-hl { color: var(--code-ink); min-height: 100%; pointer-events: none; min-width: max-content; }
.ed-ta { position: absolute; inset: 0; width: 100%; height: 100%; resize: none; overflow: hidden; background: transparent; color: transparent; caret-color: #FFFFFF; outline: none; }
.ed-ta::selection { background: rgba(124, 199, 232, .35); color: transparent; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.toolbar .hint-k { margin-left: auto; color: var(--muted); font-size: .8rem; }
pre.console { margin: 0; background: var(--code-bg); color: #CFE8D2; font-family: var(--f-code); font-size: .85rem; line-height: 1.55; padding: 10px 14px; border-radius: 8px; min-height: 3.4em; max-height: 240px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
pre.console .muted { color: var(--code-muted); }
pre.console .new { color: #FFFFFF; background: var(--code-hi); }
.errbox { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.errbox .etype { font-family: var(--f-code); color: var(--bad); font-weight: 600; font-size: .9rem; word-break: break-word; }
.okbox { border: 1px solid var(--ok); background: var(--ok-soft); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.okbox h4 { color: var(--ok); font-size: 1.1rem; }
.label { font-family: var(--f-display); font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; margin-bottom: 4px; display: block; }

/* Stepper */
.stepper { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; }
.st-code { background: var(--code-bg); border-radius: 8px; padding: 10px 0; font-family: var(--f-code); font-size: .88rem; line-height: 1.6; color: var(--code-ink); overflow-x: auto; min-width: 0; }
.st-code .ln { display: flex; white-space: pre; padding-right: 14px; border-left: 3px solid transparent; }
.st-code .ln .no { width: 2.6em; text-align: right; padding-right: 12px; color: var(--code-muted); flex: none; }
.st-code .ln.cur { background: var(--code-hi); border-left-color: var(--accent); }
.st-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.st-note { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; min-height: 4.6em; font-size: .95rem; }
.vt { display: flex; flex-wrap: wrap; gap: 8px; }
.vbox { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; min-width: 70px; background: var(--panel); }
.vbox .vn { font-family: var(--f-code); font-size: .75rem; background: var(--panel-2); padding: 2px 8px; color: var(--muted); }
.vbox .vv { font-family: var(--f-code); font-size: .9rem; padding: 4px 8px; word-break: break-word; }
.vbox.changed { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.vbox.locked .vn::after { content: " · const"; }
.st-ctrl { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.st-count { color: var(--muted); font-size: .88rem; margin-inline: auto; }

/* Widgets */
.widget { display: flex; flex-direction: column; gap: 12px; }
.wrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: .82rem; color: var(--muted); }
.field input, .field select { font: inherit; font-size: .95rem; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; min-width: 0; }
.field input[type="text"], .field input[type="number"] { width: 9em; }
.field input[type="range"] { width: 220px; max-width: 100%; padding: 0; }
.lamp { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-code); font-weight: 600; padding: 6px 12px; border-radius: 99px; background: var(--panel-2); }
.lamp i { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); }
.lamp.t { background: var(--ok-soft); color: var(--ok); } .lamp.t i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.lamp.f { background: var(--bad-soft); color: var(--bad); } .lamp.f i { background: var(--bad); }
.slots { display: flex; gap: 6px; flex-wrap: wrap; }
.slot { border: 1px solid var(--line); border-radius: 6px; min-width: 76px; text-align: center; background: var(--panel); overflow: hidden; }
.slot .si { background: var(--panel-2); font-family: var(--f-code); font-size: .75rem; color: var(--muted); padding: 2px; }
.slot .sv { font-family: var(--f-code); padding: 8px 6px; }
.slot.hit { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.machine { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.3fr) auto minmax(0, 1fr); gap: 10px; align-items: center; }
.machine .mbox { border: 1px dashed var(--line); border-radius: 8px; padding: 10px; font-family: var(--f-code); font-size: .85rem; min-width: 0; word-break: break-word; }
.machine .mbox.core { border-style: solid; border-color: var(--signal); background: var(--signal-soft); }
.machine .arrow { color: var(--muted); font-size: 1.2rem; }

/* Challenge */
.scene { background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.scene-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--f-display); font-size: .85rem; letter-spacing: .1em; text-transform: uppercase; color: var(--code-muted); }
.state-lamp { display: inline-flex; align-items: center; gap: 6px; color: var(--code-ink); }
.state-lamp i { width: 10px; height: 10px; border-radius: 50%; background: #E0645A; box-shadow: 0 0 8px #E0645A; }
.state-lamp.on i { background: #5BC98B; box-shadow: 0 0 10px #5BC98B; }
.crt { background: #071009; border-radius: 8px; padding: 14px; min-height: 120px; font-family: var(--f-code); color: #7FE0A0; font-size: .95rem; text-shadow: 0 0 6px rgba(127, 224, 160, .45); white-space: pre-wrap; word-break: break-word; }
.crt .dim { color: #3F6E4E; text-shadow: none; }
.doorframe { position: relative; height: 170px; border-radius: 8px; background: #071009; overflow: hidden; display: grid; place-items: center; }
.doorframe .behind { font-family: var(--f-display); color: #5BC98B; font-size: 1.2rem; letter-spacing: .15em; }
.leaf { position: absolute; top: 0; bottom: 0; width: 50%; background: repeating-linear-gradient(135deg, #2C3A46 0 14px, #26333E 14px 28px); border: 2px solid #3B4C5B; transition: transform .9s cubic-bezier(.6, 0, .2, 1); }
.leaf.l { left: 0; } .leaf.r { right: 0; }
.doorframe.open .leaf.l { transform: translateX(-100%); } .doorframe.open .leaf.r { transform: translateX(100%); }
.keypad { position: absolute; z-index: 2; right: 12px; top: 12px; background: #0B1117; border: 1px solid #3B4C5B; border-radius: 6px; padding: 6px 10px; font-family: var(--f-code); font-size: .8rem; color: var(--t-n); }
.grid-host { display: flex; justify-content: center; }
.grid { position: relative; display: grid; grid-template-columns: repeat(var(--cols), 1fr); width: min(100%, calc(var(--cols) * 44px)); aspect-ratio: var(--cols) / var(--rows); max-width: 100%; border-radius: 6px; overflow: hidden; }
.cell { border: 1px solid #0B1117; }
.cell.wall { background: repeating-linear-gradient(45deg, #2A3743 0 6px, #24303A 6px 12px); }
.cell.floor { background: #18242F; }
.cell.goal { background: #18242F; box-shadow: inset 0 0 0 3px #5BC98B; position: relative; }
.cell.goal::after { content: "EXIT"; position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-code); font-size: 9px; color: #5BC98B; }
.bot { position: absolute; display: grid; place-items: center; transition: left .2s linear, top .2s linear, transform .2s linear; }
.bot svg { width: 72%; height: 72%; }
.bot.crash { animation: shake .35s 2; }
@keyframes shake { 25% { translate: -3px 0; } 75% { translate: 3px 0; } }
.cases { width: 100%; border-collapse: collapse; font-size: .88rem; }
.cases th { text-align: left; font-family: var(--f-display); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; }
.cases td { border-top: 1px solid var(--line); padding: 7px 8px; vertical-align: top; }
.cases td code { white-space: pre-wrap; word-break: break-word; }
.res { font-weight: 700; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.res.ok { color: var(--ok); } .res.bad { color: var(--bad); } .res.wait { color: var(--muted); }
.hints { display: flex; flex-direction: column; gap: 8px; }
.hint { background: var(--accent-soft); border-radius: 6px; padding: 8px 12px; font-size: .93rem; }
.stars-big { font-size: 1.8rem; color: var(--accent); letter-spacing: 4px; }
.predict textarea { width: 100%; font-family: var(--f-code); font-size: .9rem; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; min-height: 4.5em; }
ul.ideas { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
/* Roomier layout */
main { padding-block: 36px 88px; }
.lesson-head { margin-bottom: 28px; }
.stages { margin-bottom: 40px; }
.cols { gap: 32px; }
.stack { gap: 24px; }
.stack-lg { display: flex; flex-direction: column; gap: 36px; min-width: 0; }
.panel { padding: 24px 26px; border-radius: 12px; }
.panel h3 { margin-bottom: 14px; }
.toolbar { margin-top: 14px; gap: 10px; }
.next-row { margin-top: 36px; }
.reader { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
.reader .next-row { margin-top: 4px; }
.reader .prose { max-width: none; gap: 26px; font-size: 1.06rem; line-height: 1.7; }
.reader .prose section { display: flex; flex-direction: column; gap: 8px; }
.reader .prose h3 { margin-top: 0; }
.brief { padding: 16px 20px; }
.brief-lg { font-size: 1.05rem; line-height: 1.65; align-self: start; }
table.explain td { padding: 11px 12px; }
ul.mistakes, ul.ideas { gap: 10px; }
.terms { gap: 10px 20px; }
.subnav { display: flex; gap: 8px; flex-wrap: wrap; }
.sub { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 99px; padding: 6px 14px 6px 6px; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: .92rem; }
.sub span { width: 24px; height: 24px; border-radius: 50%; background: var(--panel-2); display: grid; place-items: center; font-family: var(--f-code); font-size: .78rem; }
.sub.on { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
.sub.on span { background: var(--accent); color: var(--accent-ink); }
.drill-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.drill-head h3 { margin: 2px 0 0; }
.drill-task { margin-bottom: 14px; max-width: 68ch; }
/* Show code exactly as typed: no ligatures, so >= never turns into ≥ and beginners see the real characters */
code, pre, textarea, .ed-hl, .ed-ta, .st-code, .gutter, .crt, .rig-out, .pv-box, .pv-in, .sym { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
/* Practice page preview (Control Room) */
.pv { display: flex; flex-direction: column; gap: 8px; background: #E8EEF2; color: #15202B; padding: 12px; border: 3px solid #3A4B5C; font-family: var(--f-body); }
.pv-h { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; }
.pv-field { display: flex; flex-direction: column; gap: 2px; }
.pv-lab { font-family: var(--f-code); font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: #53637A; }
.pv-box { background: #FFFFFF; border: 2px solid #15202B; padding: 6px 10px; font-family: var(--f-code); font-size: .9rem; min-height: 2em; word-break: break-word; }
.pv-btn { align-self: flex-start; font-family: var(--f-display); font-weight: 600; background: #F09F4E; color: #1A1006; border: 2px solid #15202B; box-shadow: 0 3px 0 #15202B; padding: 5px 14px; border-radius: 0; }
.pv-btn:disabled { cursor: default; opacity: 1; }
.pv.live .pv-btn { cursor: pointer; }
.pv.live .pv-btn:active { transform: translateY(3px); box-shadow: none; }
.pv-in { font: inherit; font-family: var(--f-code); font-size: .9rem; border: 2px solid #15202B; padding: 5px 8px; background: #FFFFFF; color: #15202B; width: 100%; max-width: 220px; border-radius: 0; }
.pv-in:disabled { background: #F4F6F8; }
.pv-track { background: #FFFFFF; border: 2px solid #15202B; height: 22px; }
.pv-bar { height: 100%; background: #5CC2CB; width: 0; transition: width .3s steps(6); font-family: var(--f-code); font-size: .7rem; overflow: hidden; }
.pvc-hidden { display: none; }
.pvc-on, .pvc-ok { background: #5BC98B; } .pvc-warn { background: #F5CB74; } .pvc-off { opacity: .55; } .pvc-big { font-size: 1.3rem; }
.pv-note { font-size: .8rem; color: var(--code-muted); margin-top: 8px; }
.mini-pv .pv { padding: 6px; gap: 4px; border-width: 2px; font-size: .75rem; }
.mini-pv .pv-h { font-size: .85rem; }
.mini-pv .pv-box { padding: 2px 5px; font-size: .7rem; min-height: 0; }
.mini-pv .pv-btn { padding: 2px 6px; font-size: .7rem; box-shadow: 0 2px 0 #15202B; }
.mini-pv .pv-in { padding: 2px 4px; font-size: .7rem; }
.mini-pv .pv-track { height: 12px; }
.st-page { padding: 8px; }
/* Training Deck */
.arena-card { border-color: var(--signal); }
.tier { display: inline-block; font-family: var(--f-display); font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 1px 7px; border: 2px solid currentColor; }
.tier.t-easy { color: var(--ok); } .tier.t-medium { color: var(--accent); } .tier.t-hard { color: var(--bad); }
.tier.on { background: currentColor; } .tier.on, .tier.on * { color: var(--bg); }
.tier.t-easy.on { background: var(--ok); } .tier.t-medium.on { background: var(--accent); } .tier.t-hard.on { background: var(--bad); }
.eyebrow .tier { margin-right: 6px; vertical-align: 1px; }
.tier-list { display: flex; flex-direction: column; gap: 8px; }
.tier-row { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.tier-row .tier { text-align: center; }
.tiers { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.tier-dot { width: 12px; height: 12px; border: 2px solid var(--frame); background: var(--panel-2); }
.tier-dot.on.t-easy { background: var(--ok); } .tier-dot.on.t-medium { background: var(--accent); } .tier-dot.on.t-hard { background: var(--bad); }
/* Welcome card and tour */
.welcome { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 28px; border-color: var(--accent); }
.welcome > div:not(.toolbar) { flex: 1; min-width: 200px; }
.welcome .toolbar { margin-top: 0; }
.welcome-icon { width: 48px; height: auto; }
.tour-ov { position: fixed; inset: 0; z-index: 95; background: rgba(4, 8, 12, .72); display: grid; place-items: center; padding: 16px; }
.tour { width: min(560px, 100%); max-height: 100%; overflow: auto; background: var(--panel); color: var(--ink); border: 3px solid var(--frame); box-shadow: 8px 8px 0 var(--accent-deep); padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; animation: toast-in .2s steps(4); }
.tour-head { display: flex; gap: 14px; align-items: center; margin-bottom: 10px; }
.tour-head h2 { font-size: 1.5rem; }
.tour-icon { width: 56px; height: auto; flex: none; background: var(--code-bg); border: 3px solid var(--frame); padding: 6px; }
.tour-body p { line-height: 1.65; }
.tour-nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tour-dots { display: inline-flex; gap: 5px; margin-right: auto; margin-left: 8px; }
.tour-dots i { width: 10px; height: 10px; background: var(--panel-2); border: 2px solid var(--frame); }
.tour-dots i.on { background: var(--accent); }
.tour-strip, .tour-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.tour-strip span { font-family: var(--f-display); font-size: .85rem; padding: 4px 8px; border: 2px solid var(--frame); background: var(--panel-2); }
.tour-tools .btn { pointer-events: none; }
.tour-stars { margin-top: 14px; }
/* Trace my code */
.trace-head { margin-bottom: 12px; }
.trace-head h4 { font-size: 1.05rem; margin-bottom: 2px; }
.st-grid { padding: 8px; }
.st-grid .grid { width: min(100%, calc(var(--cols) * 30px)); }
/* Step-through player controls */
.st-ctrl .st-count { margin-inline: 0 0; margin-left: auto; }
.st-speed { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); }
.st-speed select { font: inherit; font-size: .85rem; color: var(--ink); background: var(--panel); border: 2px solid var(--frame); padding: 3px 6px; }
.st-code { max-height: 420px; overflow-y: auto; }
/* Reactive test rigs (always on the dark scene, so they use the fixed sprite palette) */
.rig-status { min-height: 0 !important; font-size: .82rem; padding: 8px 12px !important; }
.rig-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 8px; }
.rig { border: 2px solid #2C3A46; background: #0F1720; display: flex; flex-direction: column; min-width: 0; }
.rig.ok { border-color: #2E7D55; } .rig.bad { border-color: #A8352D; } .rig.ran { border-color: #2B6F7A; }
.rig-h { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 4px 8px; background: #16212B; font-family: var(--f-code); font-size: .68rem; color: #8A9AAB; }
.rig-h span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rig-lamp { width: 8px; height: 8px; background: #4A5A6B; flex: none; }
.rig.ok .rig-lamp { background: #5BC98B; box-shadow: 0 0 6px #5BC98B; } .rig.bad .rig-lamp { background: #F07B6F; box-shadow: 0 0 6px #F07B6F; } .rig.ran .rig-lamp { background: #5CC2CB; }
.rig-b { padding: 8px; display: flex; flex-direction: column; gap: 6px; flex: 1; justify-content: space-between; }
.rig-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rig-out { font-family: var(--f-code); font-size: .72rem; color: #CFE8D2; background: #071009; padding: 3px 6px; word-break: break-word; }
.rig-out.bad, .rig-out.hot { color: #F07B6F; } .rig-out.warm { color: #F5CB74; } .rig-out.cool { color: #5BC98B; }
.rig-big { font-family: var(--f-display); font-size: 1.3rem; color: #E8EEF2; }
.rig-b small { color: #8A9AAB; font-size: .7rem; }
.rig-arrow { color: #8A9AAB; }
.rig-empty { font-family: var(--f-code); font-size: .72rem; color: #6C8195; padding: 8px 0; }
.rig-sprite { width: 28px; height: auto; flex: none; }
.rig-tags { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
.rchip { display: inline-block; font-family: var(--f-code); font-size: .68rem; padding: 1px 5px; border: 1px solid #4A5A6B; color: #C9D4DD; margin: 1px 2px 1px 0; }
.rchip.ok { border-color: #5BC98B; color: #5BC98B; } .rchip.bad { border-color: #F07B6F; color: #F07B6F; }
.vbars { display: flex; gap: 4px; align-items: flex-end; }
.vbar { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 16px; }
.vbar-t { width: 14px; height: 54px; background: #16212B; border: 1px solid #2C3A46; display: flex; align-items: flex-end; }
.vbar-t i { display: block; width: 100%; background: #F09F4E; transition: height .4s steps(6); }
.vbar.alt .vbar-t i { background: #5CC2CB; } .vbar.hi .vbar-t i { background: #F07B6F; }
.vbar small { font-family: var(--f-code); font-size: .6rem; color: #8A9AAB; line-height: 1; height: 10px; }
.gate { display: flex; gap: 2px; width: 34px; height: 40px; border: 2px solid #4A5A6B; padding: 2px; margin-left: auto; overflow: hidden; }
.gate i { flex: 1; background: repeating-linear-gradient(0deg, #4A5A6B 0 4px, #2C3A46 4px 8px); transition: transform .4s steps(4); }
.gate.open { border-color: #5BC98B; } .gate.shut { border-color: #F07B6F; }
.gate.open i:first-child { transform: translateX(-110%); } .gate.open i:last-child { transform: translateX(110%); }
.thermo { width: 14px; height: 54px; border: 2px solid #4A5A6B; display: flex; align-items: flex-end; padding: 1px; }
.thermo i { width: 100%; background: #5CC2CB; } .thermo.warm i { background: #F5CB74; } .thermo.hot i { background: #F07B6F; }
.receipt { font-family: var(--f-code); font-size: .75rem; display: flex; flex-direction: column; gap: 2px; background: #E8EEF2; color: #15202B; padding: 6px 8px; }
.receipt div { display: flex; justify-content: space-between; gap: 8px; } .receipt .tot { border-top: 1px dashed #4A5A6B; padding-top: 2px; font-weight: 600; }
.crystals { display: flex; flex-wrap: wrap; gap: 4px; min-height: 26px; align-items: flex-end; padding-top: 4px; }
.cry { width: 16px; height: 20px; background: var(--c); clip-path: polygon(50% 0, 100% 30%, 100% 70%, 50% 100%, 0 70%, 0 30%); }
.cry.mark { transform: translateY(-4px); filter: brightness(1.3); }
.profile { display: flex; gap: 8px; align-items: center; }
.profile > div { flex: 1; min-width: 0; }
.profile b { color: #E8EEF2; font-family: var(--f-display); font-weight: 600; }
.pbar { height: 6px; background: #16212B; border: 1px solid #2C3A46; margin: 3px 0; min-width: 40px; }
.pbar i { display: block; height: 100%; background: #5BC98B; max-width: 100%; }
.screen { font-family: var(--f-code); font-size: .72rem; color: #7FE0A0; background: #071009; padding: 4px 6px; word-break: break-word; }
.scan { position: relative; }
.scan .thresh { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed #F07B6F; bottom: calc(12px + 54px * .7); }
.tank { width: 26px; height: 54px; border: 2px solid #4A5A6B; position: relative; display: flex; align-items: flex-end; padding: 1px; }
.tank i { width: 100%; background: #F09F4E; }
.tank .reserve { position: absolute; left: -4px; right: -4px; height: 0; border-top: 2px dashed #F07B6F; }
.gauge { position: relative; flex: 1; min-width: 70px; height: 12px; background: #16212B; border: 1px solid #2C3A46; }
.gauge .safe { position: absolute; left: calc(95 / 140 * 100%); width: calc(10 / 140 * 100%); top: 0; bottom: 0; background: #2E7D55; }
.gauge i { position: absolute; top: -3px; bottom: -3px; width: 3px; margin-left: -1px; background: #F5CB74; }
.airlock { display: flex; gap: 2px; height: 22px; border: 2px solid #4A5A6B; padding: 2px; overflow: hidden; }
.airlock i { flex: 1; background: repeating-linear-gradient(90deg, #4A5A6B 0 4px, #2C3A46 4px 8px); transition: transform .4s steps(4); }
.airlock.open i:first-child { transform: translateX(-105%); } .airlock.open i:last-child { transform: translateX(105%); }
.shields { display: flex; gap: 3px; }
.shields span { width: 22px; height: 24px; display: grid; place-items: center; font-family: var(--f-code); font-size: .65rem; color: #6C8195; background: #16212B; clip-path: polygon(0 0, 100% 0, 100% 60%, 50% 100%, 0 60%); }
.shields span.on { background: #5CC2CB; color: #0B1117; }
.crew { display: flex; flex-direction: column; gap: 3px; }
.crew > div { display: grid; grid-template-columns: 34px 1fr; gap: 6px; align-items: center; font-family: var(--f-code); font-size: .68rem; color: #C9D4DD; }
.crew > div.tired span { color: #F07B6F; } .crew .tired .pbar i { background: #F07B6F; }
/* Mastery meters, finales, review queue, achievements */
.node-foot { margin-top: auto; padding-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.node .stars { margin: 0; padding: 0; }
.meter { display: inline-flex; gap: 2px; vertical-align: middle; }
.meter i { width: 9px; height: 9px; background: var(--panel-2); border: 2px solid var(--frame); }
.meter.m1 i.on, .meter.m2 i.on { background: var(--accent); }
.meter.m3 i.on { background: var(--signal); }
.meter.m4 i.on { background: var(--ok); }
.node.finale { border-width: 5px; border-style: double; }
.node.finale .lv { color: var(--accent); display: inline-flex; gap: 5px; align-items: center; font-family: var(--f-display); }
.stages.three { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 620px; }
.lesson-head .lh-text { flex: 1; min-width: 0; }
.lh-mastery { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; align-self: center; }
.lh-mastery .label { margin: 0; }
.lh-mastery small { font-family: var(--f-display); color: var(--muted); }
.reviewq { margin-bottom: 32px; }
.rq-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.rq-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--panel-2); border: 2px solid var(--frame); }
.rq-item > div { flex: 1; min-width: 0; }
.rq-item b { display: block; font-family: var(--f-display); font-weight: 600; }
.rq-item small { color: var(--muted); font-size: .85rem; }
.rq-icon { width: 32px; height: auto; flex: none; }
.achpanel { margin-top: 36px; }
.achgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 10px; margin-top: 12px; }
.ach { display: flex; gap: 10px; align-items: center; padding: 10px; border: 2px solid var(--line); background: var(--panel); opacity: .62; }
.ach.got { opacity: 1; border-color: var(--accent); background: var(--accent-soft); }
.ach b { display: block; font-family: var(--f-display); font-weight: 600; font-size: .95rem; }
.ach small { color: var(--muted); font-size: .8rem; line-height: 1.35; display: block; }
.ach.got small { color: var(--ink); }
.ach-icon { width: 34px; height: auto; flex: none; }
.ach:not(.got) .ach-icon { filter: grayscale(1); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.toast.ach { border-color: #F5CB74; }
@media (max-width: 560px) {
  .lh-mastery { align-items: flex-start; width: 100%; flex-direction: row; gap: 10px; }
  .rq-item { flex-wrap: wrap; }
}
/* Symbol bar (phones and touch screens) */
.symbar { display: none; }
@media (pointer: coarse), (max-width: 700px) {
  .symbar { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 10px; margin-bottom: 4px; scrollbar-width: thin; }
}
.sym { flex: none; min-width: 40px; height: 40px; padding: 0 8px; font-family: var(--f-code); font-size: 1.05rem; font-weight: 600; color: var(--ink); background: var(--panel-2); border: 2px solid var(--frame); border-radius: 0; box-shadow: 0 3px 0 var(--btn-shadow); touch-action: manipulation; }
.sym:active { transform: translateY(3px); box-shadow: none; }
/* Save panel */
.savepanel { margin-top: 36px; }
.savebox { width: 100%; min-height: 5em; font-family: var(--f-code); font-size: .8rem; word-break: break-all; background: var(--panel); color: var(--ink); border: 2px solid var(--frame); padding: 8px; resize: vertical; }
.ver { display: inline-block; margin-left: 6px; font-family: var(--f-display); color: var(--ink); }
/* Toasts */
.toasts { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 10px; align-items: center; width: min(92vw, 420px); pointer-events: none; }
.toast { pointer-events: auto; width: 100%; background: var(--code-bg); color: var(--code-ink); border: 3px solid var(--accent); box-shadow: 5px 5px 0 var(--shadow); padding: 10px 14px; font-family: var(--f-display); display: flex; gap: 12px; align-items: center; animation: toast-in .25s steps(4); }
.toast img { width: 36px; height: auto; flex: none; }
.toast small { display: block; font-family: var(--f-body); color: var(--code-muted); font-size: .82rem; }
.toast.out { opacity: 0; transition: opacity .35s; }
@keyframes toast-in { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
@media (max-width: 560px) {
  /* The status bar wraps to several lines on phones, so let it scroll away instead of covering the page */
  .topbar { position: static; }
  .topbar .wrap { gap: 8px 16px; }
  .panel { padding: 18px 16px; }
  .stack-lg { gap: 26px; }
}
/* ===== Pixel game skin: square corners, thick frames, hard drop shadows, pixel sprites ===== */
:root { --frame: #15202B; --shadow: #A3B0BC; --btn-shadow: #8E9BA8; --accent-deep: #7A3A08; --grid-dot: rgba(21, 32, 43, .08); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --frame: #3A4B5C; --shadow: #04080C; --btn-shadow: #04080C; --accent-deep: #8A4A12; --grid-dot: rgba(225, 232, 238, .05); } }
:root[data-theme="dark"] { --frame: #3A4B5C; --shadow: #04080C; --btn-shadow: #04080C; --accent-deep: #8A4A12; --grid-dot: rgba(225, 232, 238, .05); }
body { background-image: radial-gradient(var(--grid-dot) 1px, transparent 1.5px); background-size: 12px 12px; }
.px { image-rendering: crisp-edges; image-rendering: pixelated; }
.panel, .node, .stage-tab, .scene, .hero-card, .loop-strip div, .brief, .errbox, .okbox, .editor, pre.code, pre.console, .st-code, .st-note, .hint,
.vbox, .slot, .crt, .doorframe, .grid, .compare > div, .keypad, .pill, .sub, .sub span, .field input, .field select, .lamp, .xpbar, .xpbar i,

  if (R.out.err === undefined) return fail(q(txt) + " should throw an error with the message " + q(msg) + ", but it returned " + q(show(R.out.v)) + ". Use <code>throw new Error(" + esc(JSON.stringify(msg)) + ");</code>", show(R.out.v));
  return R.out.err === msg ? pass("throws " + show(msg)) : fail(q(txt) + " threw " + q(R.out.err) + " instead of " + q(msg) + ".", R.out.err); } }; };
// Builds a test case that drives a class through `script` (inside try), then checks __report
const classCase = (label, expect, script, check) => ({ label, expect, post: "try { " + script + " } catch (e) { __report.err = e.message; }",
  check: r => r.report.err ? fail("Using your class failed: " + esc(r.report.err), "error") : check(r.report) });
// A test case for an async function: waits (on the simulated clock) for what it resolves to
const asyncCase = (fn, args, exp, extra, tips) => { const txt = fn + "(" + args.map(a => show(a)).join(", ") + ")"; return Object.assign({ label: txt, expect: show(exp),
  post: "__report.isFn = typeof " + fn + " === 'function'; if (__report.isFn) __report.out = __acall(" + fn + (args.length ? ", " + args.map(a => JSON.stringify(a)).join(", ") : "") + ");",
  check: r => r.report.isFn && r.report.out && r.report.out.pending ? fail(q(txt) + " never finished. Is an await waiting on something that never answers?", "still waiting") : callCheck(r.report, fn, txt, exp, tips) }, extra || {}); };

    ["Read the error message", "An error tells you three things: the <b>type</b> (SyntaxError, ReferenceError, TypeError), a <b>message</b> describing the problem, and a <b>line number</b>. Fix the first error first: one mistake can cause others."],

  ],
  terms: [["SyntaxError", "the code can't be read at all; nothing runs"], ["ReferenceError", "a name that doesn't exist, often a typo"], ["TypeError", "a value used the wrong way"], ["logic bug", "code that runs but gives the wrong result"]],

{

    ["Yes-or-no questions", "<code>nums.some(n => n < 0)</code> is true if <b>at least one</b> element passes. <code>nums.every(n => n > 0)</code> is true only if <b>all</b> of them do."],
    ["Reduce: boil a list down to one value", "<code>nums.reduce((total, n) => total + n, 0)</code> starts <code>total</code> at 0, then gives the callback each element in turn. Whatever the callback returns becomes the next total. It's the accumulator pattern in one line."],
    ["Picking the right tool", "map: same number of elements, changed. filter: fewer elements. find: one element. some and every: true or false. reduce: a single value of any kind."]
  ],
  terms: [["find", "the first element that passes, or undefined"], ["some / every", "does at least one / every element pass?"], ["reduce", "combines all elements into one value"], ["accumulator", "the running result passed from round to round"]],

  story: "Vault records get copied, merged and unpacked all day. A few pieces of shorthand make that safe and quick.",

    ["Unpacking an object", "<code>const { name, fuel } = ship;</code> makes two variables, <code>name</code> and <code>fuel</code>, from the properties with those names. This is called <b>destructuring</b>."],
    ["Unpacking an array", "<code>const [first, second] = crew;</code> takes elements in order: first gets <code>crew[0]</code>, second gets <code>crew[1]</code>."],
    ["Spreading with ...", "Three dots spread an array or object out. <code>[...a, ...b]</code> makes one new array from two. <code>{ ...ship, fuel: 100 }</code> copies the ship and replaces its fuel, and the original isn't touched."],
    ["Default values", "<code>function greet(name = \"pilot\") { … }</code> uses \"pilot\" when no name is passed. Defaults also work when unpacking: <code>const { rank = \"cadet\" } = person;</code>"]
  ],
  terms: [["destructuring", "unpacking properties or elements into variables"], ["spread (...)", "copying all elements or properties into a new array or object"], ["default value", "used when nothing (undefined) is given"]],
  example: { code: 'const ship = { name: "Kite", fuel: 30 };\nconst { name, fuel } = ship;\nconsole.log(`${name} ${fuel}`);\nconst refuelled = { ...ship, fuel: 100 };\nconsole.log(refuelled);\nconsole.log(ship.fuel);\nconst [a, b] = ["Ada", "Bo", "Cy"];\nconsole.log(b);', lines: ["A ship object.", "Unpack two properties into variables of the same names.", "Prints Kite 30.", "Copy every property, then replace fuel.", "Prints { name: \"Kite\", fuel: 100 }.", "The original is untouched: 30.", "Unpack the first two elements. Cy is simply ignored.", "Prints Bo."] },
  symbols: [["const { a, b } = obj", "unpack properties"], ["const [x, y] = arr", "unpack elements"], ["[...a, ...b]", "new array from both"], ["{ ...obj, key: v }", "copy, then override"], ["(x = 5)", "default value"]],
  good: { code: "const updated = { ...ship, fuel: 100 };", why: "A new object: the original ship keeps its old fuel." },
  bad: { code: "const updated = ship;\nupdated.fuel = 100;", why: "updated is the same object as ship, not a copy, so this changes the original ship too." },
  mistakes: ["Unpacking a name that doesn't match any property: you get undefined.", "Forgetting the dots: <code>[a, b]</code> nests two arrays, while <code>[...a, ...b]</code> joins them.", "Order matters: in <code>{ fuel: 100, ...ship }</code>, ship's fuel wins because it comes last.", "Thinking <code>const copy = obj</code> makes a copy. It doesn't: both names point to the same object."],
  trace: { code: 'const ship = { name: "Kite", fuel: 30 };\nconst { name, fuel } = ship;\nconsole.log(`${name} ${fuel}`);\nconst refuelled = { ...ship, fuel: 100 };\nconsole.log(refuelled);\nconsole.log(ship.fuel);\nconst [a, b] = ["Ada", "Bo", "Cy"];\nconsole.log(b);', steps: [
    { l: 0, v: { ship: '{ name: "Kite", fuel: 30 }' } },
    { l: 1, v: { name: '"Kite"', fuel: "30" }, n: "Two new variables, unpacked from the ship's properties." },
    { l: 2, o: "Kite 30" },
    { l: 3, v: { refuelled: '{ name: "Kite", fuel: 100 }' }, n: "...ship copies both properties, then fuel: 100 replaces the copy's fuel." },
    { l: 4, o: '{ name: "Kite", fuel: 100 }' },
    { l: 5, o: "30", n: "The original ship never changed." },
    { l: 6, v: { a: '"Ada"', b: '"Bo"' }, n: "Array unpacking goes by position." },
    { l: 7, o: "Bo" }] },
  practise: { starter: 'const a = ["Ada", "Bo"];\nconst b = ["Cy"];\nconst all = [...a, ...b, "Dee"];\nconsole.log(all);\nfunction greet(name = "pilot") {\n  return `Hello, ${name}!`;\n}\nconsole.log(greet());\nconsole.log(greet("Zed"));\n',
    ideas: ["Unpack the first name from <code>all</code>: <code>const [first] = all;</code>", "Make a copy of a settings object with one value changed.", "Try <code>[a, b]</code> without the dots and compare.", "Give greet a different default."] },
  predict: { code: 'const s = { x: 1, y: 2 };\nconst t = { ...s, y: 9 };\nconst u = { y: 9, ...s };\nconsole.log(t.y);\nconsole.log(u.y);\nconsole.log(s.y);', answer: "9\n2\n2", explain: "In t, y: 9 comes after the spread, so it wins. In u, the spread comes last, so s's y (2) wins. s itself never changes." },
  challenge: {
    scene: "screens", title: "Process the vault records",
    brief: "Write <code>refit(ship, changes)</code> that returns a <b>new</b> ship with the changes applied, leaving the original alone. Write <code>mergeCrews(a, b)</code> that returns one array with both crews. Write <code>badge({ name, rank })</code>, which unpacks its object parameter and returns <code>\"Ada (captain)\"</code>, using <code>cadet</code> when there's no rank. Use spread and destructuring.",
    starter: "function refit(ship, changes) {\n\n}\n\nfunction mergeCrews(a, b) {\n\n}\n\nfunction badge({ name, rank }) {\n\n}\n",
    hints: ["<code>return { ...ship, ...changes };</code> · <code>return [...a, ...b];</code>", "Add a default in the parameter: <code>function badge({ name, rank = \"cadet\" })</code>, then <code>return `${name} (${rank})`;</code>"],
    src: [{ test: s => /\.\.\./.test(s), msg: "Use spread (...) to copy and merge." }],
    cases: [
      { label: 'refit({ name: "Kite", fuel: 30 }, { fuel: 100 })', expect: '{ name: "Kite", fuel: 100 }, original unchanged',
        post: "__report.isFn = typeof refit === 'function'; const __ship = { name: 'Kite', fuel: 30 }; if (__report.isFn) __report.out = __call(refit, __ship, { fuel: 100 }); __report.orig = __ship;",
        check: r => { const c = callCheck(r.report, "refit", "refit(ship, { fuel: 100 })", { name: "Kite", fuel: 100 }); if (!c.ok) return c; return r.report.orig.fuel !== 30 ? fail("The result is right, but the original ship was changed too. Copy it with spread instead of changing it.", "original fuel " + r.report.orig.fuel) : c; } },
      fnCase("refit", [{ name: "Orion", crew: 2 }, { name: "Orion II", crew: 4 }], { name: "Orion II", crew: 4 }),
      fnCase("mergeCrews", [["Ada", "Bo"], ["Cy"]], ["Ada", "Bo", "Cy"], v => Array.isArray(v) && Array.isArray(v[0]) ? "That nests the arrays. Spread them: <code>[...a, ...b]</code>." : ""),
      fnCase("mergeCrews", [[], ["Zed"]], ["Zed"]),
      fnCase("badge", [{ name: "Ada", rank: "captain" }], "Ada (captain)"),
      fnCase("badge", [{ name: "Bo" }], "Bo (cadet)", v => v === "Bo (undefined)" ? "No rank was given, so use a default: <code>rank = \"cadet\"</code>." : "")],
    solution: "function refit(ship, changes) {\n  return { ...ship, ...changes };\n}\n\nfunction mergeCrews(a, b) {\n  return [...a, ...b];\n}\n\nfunction badge({ name, rank = \"cadet\" }) {\n  return `${name} (${rank})`;\n}",
    why: ["Define refit.", "Copy every property of ship, then every property of changes. Later ones win, and the original isn't touched.", "", "", "Define mergeCrews.", "Spread both arrays into one new array.", "", "", "Unpack the object parameter, with a default rank.", "Build the badge text.", ""]
  },
  recap: ["Destructuring unpacks properties or elements into variables.", "<code>...</code> spreads arrays and objects into new ones, which is safe copying.", "Default values fill in when nothing is given."]
},
{
  id: "classes", world: 9, title: "Blueprints", concept: "Classes, constructors and methods",
  story: "The vault keeps records for hundreds of robots, all the same shape. Writing each object by hand is a waste of time. Make a blueprint instead.",
  learn: [
    ["One blueprint, many objects", "A <b>class</b> is a blueprint for objects that share the same shape and abilities. You describe it once, then build as many objects from it as you like."],
    ["The constructor", "Inside a class, <code>constructor(name) { … }</code> runs every time a new object is built. <code>this</code> means \"the object being built\": <code>this.name = name;</code> stores the name on it."],
    ["Building with new", "<code>const bolt = new Robot(\"Bolt\");</code> builds a new Robot. Then <code>bolt.name</code> is \"Bolt\". Forgetting <code>new</code> is an error."],
    ["Methods", "Functions written inside the class are <b>methods</b>: <code>charge(amount) { this.battery = this.battery + amount; }</code>. Call them with a dot: <code>bolt.charge(10)</code>. Inside a method, <code>this</code> is the object it was called on."]
  ],
  terms: [["class", "a blueprint for making objects"], ["constructor", "the method that sets up each new object"], ["this", "inside a class: the object being built or used"], ["instance", "one object built from a class"]],
  example: { code: 'class Robot {\n  constructor(name) {\n    this.name = name;\n    this.battery = 50;\n  }\n  charge(amount) {\n    this.battery = this.battery + amount;\n  }\n  status() {\n    return `${this.name}: ${this.battery}%`;\n  }\n}\nconst bolt = new Robot("Bolt");\nbolt.charge(30);\nconsole.log(bolt.status());\nconst zed = new Robot("Zed");\nconsole.log(zed.status());', lines: ["Start the blueprint for Robot objects.", "The constructor runs for every new robot.", "Store the name on the new object.", "Every robot starts at 50%.", "", "A method: adds to this robot's battery.", "this is whichever robot the method is called on.", "", "Another method that returns a status line.", "Read this robot's own name and battery.", "", "End of the class.", "Build a robot. The constructor runs with name = \"Bolt\".", "Charge Bolt: 50 + 30 = 80.", "Prints Bolt: 80%.", "Build a second robot. It has its own battery.", "Prints Zed: 50%. Charging Bolt didn't affect Zed."] },
  symbols: [["class Name { }", "defines a blueprint"], ["constructor(…)", "sets up each new object"], ["this.x = …", "stores a value on the object"], ["new Name(…)", "builds an object from the class"], ["obj.method()", "calls a method on that object"]],
  good: { code: 'const r = new Robot("Ada");\nr.charge(5);', why: "new builds the object; the method is then called on it." },
  bad: { code: 'const r = Robot("Ada");', why: "Without <code>new</code>, JavaScript refuses: a class constructor can't be called like a normal function." },
  mistakes: ["Forgetting <code>new</code>.", "Writing <code>battery</code> instead of <code>this.battery</code> inside a method: battery is not defined.", "Putting commas between methods (classes don't use them, unlike objects).", "Calling a method without brackets: <code>bolt.status</code> is the method itself, <code>bolt.status()</code> runs it."],
  trace: { code: 'class Robot {\n  constructor(name) {\n    this.name = name;\n    this.battery = 50;\n  }\n  charge(amount) {\n    this.battery = this.battery + amount;\n  }\n  status() {\n    return `${this.name}: ${this.battery}%`;\n  }\n}\nconst bolt = new Robot("Bolt");\nbolt.charge(30);\nconsole.log(bolt.status());\nconst zed = new Robot("Zed");\nconsole.log(zed.status());', steps: [
    { l: 0, n: "The class is defined. Nothing is built yet." },
    { l: 12, n: "new Robot(\"Bolt\") builds an object and runs the constructor." },
    { l: 2, v: { name: '"Bolt"' }, n: "Inside the constructor, this is the new robot. It gets a name…" },
    { l: 3, n: "…and a battery of 50." },
    { l: 12, v: { bolt: 'Robot { name: "Bolt", battery: 50 }' }, n: "The finished object is stored in bolt." },
    { l: 6, v: { bolt: 'Robot { name: "Bolt", battery: 80 }' }, n: "charge(30): this is bolt, so bolt's battery becomes 80." },
    { l: 14, o: "Bolt: 80%", n: "status() reads bolt's own values." },
    { l: 15, v: { zed: 'Robot { name: "Zed", battery: 50 }' }, n: "A second robot, with its own separate battery." },
    { l: 16, o: "Zed: 50%" }] },
  practise: { starter: 'class Lamp {\n  constructor(colour) {\n    this.colour = colour;\n    this.on = false;\n  }\n  toggle() {\n    this.on = !this.on;\n  }\n}\nconst lamp = new Lamp("red");\nlamp.toggle();\nconsole.log(lamp);\n',
    ideas: ["Build a second lamp in a different colour and print both.", "Add a method <code>describe()</code> that returns <code>`${this.colour} lamp is ${this.on}`</code>.", "Remove <code>new</code> and read the error.", "Change <code>this.on</code> to just <code>on</code> inside toggle and read the error."] },
  predict: { code: "class Box {\n  constructor(n) {\n    this.n = n;\n  }\n  add(k) {\n    this.n = this.n + k;\n  }\n}\nconst a = new Box(1);\nconst b = new Box(10);\na.add(5);\nconsole.log(a.n);\nconsole.log(b.n);", answer: "6\n10", explain: "Each object has its own n. add(5) changed a's n from 1 to 6, and b kept its 10." },
  challenge: {
    scene: "screens", title: "Build the shuttle class",
    brief: "Write a class <code>Shuttle</code>. <code>new Shuttle(name, seats)</code> stores the name and number of seats, and starts with an empty <code>passengers</code> array. <code>board(person)</code> adds the person and returns true, unless the shuttle is full, in which case it returns false. <code>status()</code> returns text like <code>Kite: 2/3 seats taken</code>.",
    starter: "class Shuttle {\n\n}\n",
    hints: ["The constructor sets <code>this.name</code>, <code>this.seats</code> and <code>this.passengers = []</code>.", "In board, check <code>this.passengers.length >= this.seats</code> first, and return false if it's full; otherwise push and return true."],
    cases: [
      { label: 'new Shuttle("Kite", 2): board Ada, Bo, Cy', expect: "true, true, false · Kite: 2/2 seats taken",
        post: "try { const s = new Shuttle('Kite', 2); __report.r = [s.board('Ada'), s.board('Bo'), s.board('Cy')]; __report.st = s.status(); __report.p = s.passengers; } catch (e) { __report.err = e.message; }",
        check: r => { const R = r.report; if (R.err) return fail("Building or using the shuttle failed: " + esc(R.err), "error");
          if (!same(R.r, [true, true, false])) return fail("board should return true, true, then false (the shuttle is full), but returned " + q(show(R.r)) + ".", show(R.r));
          if (!same(R.p, ["Ada", "Bo"])) return fail("passengers should be " + q('["Ada", "Bo"]') + " but is " + q(show(R.p)) + ".", show(R.p));
          return R.st === "Kite: 2/2 seats taken" ? pass(R.st) : fail("status() returned " + q(show(R.st)) + " instead of " + q("Kite: 2/2 seats taken") + ".", show(R.st)); } },
      { label: 'new Shuttle("Orion", 5) with nobody aboard', expect: "Orion: 0/5 seats taken",
        post: "try { const s = new Shuttle('Orion', 5); __report.st = s.status(); } catch (e) { __report.err = e.message; }",
        check: r => r.report.err ? fail("Building the shuttle failed: " + esc(r.report.err), "error") : r.report.st === "Orion: 0/5 seats taken" ? pass(r.report.st) : fail("status() returned " + q(show(r.report.st)) + " instead of " + q("Orion: 0/5 seats taken") + ".", show(r.report.st)) }],
    solution: "class Shuttle {\n  constructor(name, seats) {\n    this.name = name;\n    this.seats = seats;\n    this.passengers = [];\n  }\n  board(person) {\n    if (this.passengers.length >= this.seats) {\n      return false;\n    }\n    this.passengers.push(person);\n    return true;\n  }\n  status() {\n    return `${this.name}: ${this.passengers.length}/${this.seats} seats taken`;\n  }\n}",
    why: ["The blueprint.", "Runs for every new shuttle.", "Store the name…", "…the number of seats…", "…and an empty passenger list for this shuttle.", "", "Try to board someone.", "Already full?", "Refuse.", "", "Otherwise add them to this shuttle's list…", "…and report success.", "", "Build the status text from this shuttle's own values.", "", "", "End of the class."]
  },
  recap: ["A class is a blueprint; <code>new</code> builds objects from it.", "The constructor sets up each object using <code>this</code>.", "Methods are functions in the class, and <code>this</code> is the object they're called on."]
},

{
  id: "errors", world: 10, title: "Error Shields", concept: "try, catch and throw",
  story: "The Async Relay talks to ships light-years away, and things go wrong all the time. Instead of letting one bad message crash the whole relay, shield the code.",
  learn: [
    ["Catching errors", "Normally an error stops the program. <code>try { … } catch (err) { … }</code> changes that: the code in <code>try</code> runs, and if anything in it throws an error, JavaScript jumps straight to <code>catch</code> instead of crashing."],
    ["What's inside an error", "The caught error is an object: <code>err.message</code> is the description, and <code>err.name</code> is its type, like TypeError."],
    ["Throwing your own", "<code>throw new Error(\"Not enough fuel\");</code> stops a function on purpose when something is wrong. Whoever called it can catch the error. <code>isNaN(n)</code> is handy here: it's true when n isn't a valid number."],
    ["finally", "An optional <code>finally { … }</code> block runs at the end whether there was an error or not. It's useful for cleaning up."]
  ],
  terms: [["exception", "an error that has been thrown"], ["try / catch", "run code, and handle any error it throws"], ["throw", "raise an error on purpose"]],
  example: { code: 'function launch(fuel) {\n  if (fuel < 50) {\n    throw new Error("Not enough fuel");\n  }\n  return "Launched!";\n}\ntry {\n  console.log(launch(80));\n  console.log(launch(10));\n  console.log("never printed");\n} catch (err) {\n  console.log("Abort: " + err.message);\n}\nconsole.log("Station still running");', lines: ["A function that refuses bad input.", "Too little fuel?", "Stop right here by throwing an error.", "", "Otherwise launch normally.", "", "Try some risky code.", "Works: prints Launched!", "Throws, so the try stops on this line.", "Skipped.", "The error lands here.", "Prints Abort: Not enough fuel.", "", "The program carries on: prints Station still running."] },
  symbols: [["try { }", "code that might fail"], ["catch (err) { }", "runs only if something in try threw"], ["err.message", "the error's description"], ['throw new Error("…")', "raise an error on purpose"]],
  good: { code: 'try {\n  risky();\n} catch (err) {\n  console.log("Problem: " + err.message);\n}', why: "The error is handled and reported, and the program keeps going." },
  bad: { code: "try {\n  risky();\n} catch (err) {\n}", why: "An empty catch hides the problem completely. At least report what happened." },
  mistakes: ["An empty catch that silently swallows errors.", "Expecting the lines after the error inside try to still run. They're skipped.", "Throwing a plain string instead of <code>new Error(\"…\")</code>, which loses the name and message.", "Expecting try/catch to catch a syntax error. Code that can't be read never runs at all."],
  trace: { code: 'function launch(fuel) {\n  if (fuel < 50) {\n    throw new Error("Not enough fuel");\n  }\n  return "Launched!";\n}\ntry {\n  console.log(launch(80));\n  console.log(launch(10));\n  console.log("never printed");\n} catch (err) {\n  console.log("Abort: " + err.message);\n}\nconsole.log("Station still running");', steps: [
    { l: 0, n: "Define launch. Nothing runs yet." },
    { l: 7, o: "Launched!", n: "80 is enough fuel, so launch returns normally." },
    { l: 2, v: { fuel: "10" }, n: "launch(10): too little fuel, so it throws." },
    { l: 11, v: { err: "Error: Not enough fuel" }, o: "Abort: Not enough fuel", n: "The rest of try was skipped; catch received the error." },
    { l: 13, o: "Station still running", n: "No crash: the program keeps going." }] },
  practise: { starter: 'function divide(a, b) {\n  if (b === 0) {\n    throw new Error("Cannot divide by zero");\n  }\n  return a / b;\n}\ntry {\n  console.log(divide(10, 2));\n  console.log(divide(1, 0));\n} catch (err) {\n  console.log("Oops: " + err.message);\n}\n',
    ideas: ["Remove the try/catch and see what happens to the program.", "Add a <code>finally { console.log(\"done\"); }</code> block.", "Print <code>err.name</code> too.", "Catch a real JavaScript error: call a function that doesn't exist inside try."] },
  predict: { code: 'try {\n  console.log("A");\n  throw new Error("B");\n  console.log("C");\n} catch (e) {\n  console.log(e.message);\n}\nconsole.log("D");', answer: "A\nB\nD", explain: "A prints, then the throw jumps straight to catch, skipping C. catch prints the message B, and the program carries on to D." },
  challenge: {
    scene: "screens", title: "Shield the fuel sensor",
    brief: "Write <code>parseFuel(text)</code> that turns text like <code>\"42\"</code> into the number 42, but <b>throws</b> an error with the message <code>Bad reading: abc</code> (using the text it received) when the text isn't a number. Then write <code>safeParse(text)</code> that calls parseFuel inside try/catch and returns the number, or 0 if parseFuel throws.",
    starter: "function parseFuel(text) {\n\n}\n\nfunction safeParse(text) {\n\n}\n",
    hints: ["<code>const n = Number(text); if (isNaN(n)) { throw new Error(\"Bad reading: \" + text); } return n;</code>", "safeParse: <code>try { return parseFuel(text); } catch (err) { return 0; }</code>"],
    cases: [fnCase("parseFuel", ["42"], 42), fnCase("parseFuel", ["7.5"], 7.5), throwCase("parseFuel", ["abc"], "Bad reading: abc"), fnCase("safeParse", ["12"], 12), fnCase("safeParse", ["oops"], 0, v => typeof v === "number" && isNaN(v) ? "NaN got through: parseFuel should throw for bad text, and safeParse should catch it and return 0." : "")],
    solution: 'function parseFuel(text) {\n  const n = Number(text);\n  if (isNaN(n)) {\n    throw new Error("Bad reading: " + text);\n  }\n  return n;\n}\n\nfunction safeParse(text) {\n  try {\n    return parseFuel(text);\n  } catch (err) {\n    return 0;\n  }\n}',
    why: ["Define parseFuel.", "Try converting the text.", "Not a number?", "Refuse loudly, including the bad text in the message.", "", "A good reading is returned.", "", "", "Define safeParse.", "Risky call…", "…returned straight away if it works.", "If it threw…", "…fall back to 0.", "", ""]
  },
  recap: ["<code>try/catch</code> handles errors instead of crashing.", "<code>throw new Error(\"…\")</code> raises your own error.", "Code after a throw inside try is skipped; catch gets the error."]
},
{
  id: "timers", world: 10, title: "Timers", concept: "setTimeout, callbacks and the order of events",
  story: "Relay messages go out on a schedule: one now, one in a second, one in a minute. Code doesn't have to happen immediately.",
  learn: [
    ["Do it later", "<code>setTimeout(fn, ms)</code> runs the function fn after ms milliseconds (1000 ms is one second). In Quest the clock is simulated, so a long wait finishes instantly but still in the right order."],
    ["The rest doesn't wait", "setTimeout only <b>schedules</b> the function. The lines after it carry on straight away. Timers run once the main code has finished, earliest first."],
    ["Pass, don't call", "Give setTimeout the function itself: <code>setTimeout(ring, 1000)</code>. Writing <code>setTimeout(ring(), 1000)</code> would run ring immediately. Arrow functions are perfect here: <code>setTimeout(() => console.log(\"hi\"), 1000)</code>."],
    ["Cancelling", "setTimeout returns an id. <code>clearTimeout(id)</code> cancels that timer before it fires."]
  ],
  terms: [["setTimeout", "run a function later"], ["callback", "the function handed over to run later"], ["clearTimeout", "cancel a scheduled timer"], ["asynchronous", "code that finishes later, while other code keeps running"]],
  example: { code: 'console.log("Countdown starts");\nsetTimeout(() => console.log("Liftoff!"), 3000);\nsetTimeout(() => console.log("1"), 2000);\nsetTimeout(() => console.log("2"), 1000);\nconsole.log("Timers set");', lines: ["Runs now.", "Scheduled for 3 seconds from now. The code doesn't wait.", "Scheduled for 2 seconds.", "Scheduled for 1 second.", "Runs now, before any of the timers."] },
  symbols: [["setTimeout(fn, ms)", "run fn after ms milliseconds"], ["() => …", "a quick callback"], ["clearTimeout(id)", "cancel a timer"]],
  good: { code: "setTimeout(ring, 1000);", why: "The function itself is handed over, to run in one second." },
  bad: { code: "setTimeout(ring(), 1000);", why: "The brackets run ring immediately and hand over its result instead, which isn't a function." },
  mistakes: ["Expecting the next line to wait for the timer.", "Calling the function instead of passing it: <code>ring()</code> instead of <code>ring</code>.", "Forgetting that ms means milliseconds: 1000 is one second.", "Expecting timers to run in the order they were written. They run in time order."],
  trace: { code: 'console.log("Countdown starts");\nsetTimeout(() => console.log("Liftoff!"), 3000);\nsetTimeout(() => console.log("1"), 2000);\nsetTimeout(() => console.log("2"), 1000);\nconsole.log("Timers set");', steps: [
    { l: 0, o: "Countdown starts" },
    { l: 1, n: "Schedule Liftoff for 3 s, and carry straight on." },
    { l: 2, n: "Schedule 1 for 2 s." },
    { l: 3, n: "Schedule 2 for 1 s." },
    { l: 4, o: "Timers set", n: "The main code finishes before any timer fires." },
    { l: 3, o: "2", n: "At 1 s the earliest timer fires." },

/* ================= Progress store ================= */
const APP_VERSION = "3.0.0";
const STORE_KEY = "js-quest-v1";
// done: repaired lessons · drills: passed drills · drafts: unsent code · sess: in-progress challenge stats
// ach: unlocked achievements · stats: lifetime counters · seenIntro: first-run tour shown
// pred: lessons whose "predict the output" was answered correctly
// missions: Training Deck missions passed ("lessonId:index")
const freshStore = () => ({ done: {}, drafts: {}, sess: {}, drills: {}, ach: {}, stats: {}, pred: {}, missions: {}, seenIntro: false });
let store = freshStore();
try { const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); if (s && s.done) store = Object.assign(freshStore(), s); } catch (_) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (_) {} }

/* ---- Save codes: back up progress as text and restore it anywhere ---- */
const SAVE_PREFIX = "JSQ1";
function hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36); }
function b64encode(str) { const bytes = new TextEncoder().encode(str); let bin = ""; for (const b of bytes) bin += String.fromCharCode(b); return btoa(bin); }
function b64decode(b) { const bin = atob(b); return new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))); }
function makeSaveCode(st) {
  const body = b64encode(JSON.stringify({ v: 1, done: st.done, drills: st.drills, drafts: st.drafts, ach: st.ach, stats: st.stats, pred: st.pred, missions: st.missions, seenIntro: st.seenIntro }));
  return SAVE_PREFIX + "." + body + "." + hashStr(body);
}
// Only known lessons, drills, achievements and sane value types survive a load
function sanitizeStore(d) {
  const out = freshStore();
  const ids = new Map(LESSONS.map(l => [l.id, l]));
  const str = (v, max) => typeof v === "string" ? v.slice(0, max) : "";
  const count = v => Number.isFinite(+v) ? Math.max(0, Math.min(1e6, Math.floor(+v))) : 0;
  for (const [id, r] of Object.entries(d.done || {})) {
    if (!ids.has(id) || !r || typeof r !== "object") continue;
    out.done[id] = { stars: Math.max(1, Math.min(3, Math.round(+r.stars) || 1)), code: str(r.code, 20000), hints: count(r.hints), attempts: count(r.attempts), revealed: r.revealed === true, reviewed: r.reviewed === true, at: count(r.at) };
  }
  for (const [id, arr] of Object.entries(d.drills || {})) {
    if (!ids.has(id) || !Array.isArray(arr)) continue;
    out.drills[id] = arr.slice(0, (ids.get(id).drills || []).length).map(v => v === true);
  }
  for (const [k, v] of Object.entries(d.drafts || {})) {
    const m = /^([a-z0-9]+):(p|c|d\d|r|m\d)$/.exec(k);
    if (m && ids.has(m[1]) && typeof v === "string") out.drafts[k] = v.slice(0, 20000);
  }
  const achIds = new Set(ACHIEVEMENTS.map(a => a.id));
  for (const [k, v] of Object.entries(d.ach || {})) if (achIds.has(k)) out.ach[k] = count(v) || 1;
  for (const [k, v] of Object.entries(d.pred || {})) if (ids.has(k) && v === true) out.pred[k] = true;
  for (const [k, v] of Object.entries(d.missions || {})) { const m = /^([a-z0-9]+):(\d)$/.exec(k); if (m && ids.has(m[1]) && +m[2] < missionsOf(ids.get(m[1])).length && v === true) out.missions[k] = true; }
  for (const [k, v] of Object.entries(d.stats || {})) if (/^[a-zA-Z]{1,24}$/.test(k)) out.stats[k] = count(v);
  out.seenIntro = d.seenIntro === true;
  return out;
}
function readSaveCode(code) {
  const parts = String(code || "").replace(/\s+/g, "").split(".");
  if (parts.length !== 3 || parts[0] !== SAVE_PREFIX) return { ok: false, error: "This doesn't look like a JavaScript Quest save code. Save codes start with <code>JSQ1.</code>" };
  if (hashStr(parts[1]) !== parts[2]) return { ok: false, error: "This save code is incomplete or has been changed. Copy the whole code again, from <code>JSQ1.</code> to the very end." };
  let data;
  try { data = JSON.parse(b64decode(parts[1])); } catch (_) { return { ok: false, error: "This save code couldn't be read. Copy the whole code again." }; }
  if (!data || typeof data !== "object" || data.v !== 1) return { ok: false, error: "This save code comes from a different version of the game and can't be loaded." };
  return { ok: true, store: sanitizeStore(data) };
}

// Step-through player. tr = { code, steps: [{ l: line index, v: changed vars | vars: full snapshot, o: output line(s), n: note }] }
// Controls: Restart, Back, Play/Pause (with speed), Step. Arrow keys step, Space plays/pauses.
function mountStepper(host, tr, opts) {
  opts = opts || {};

  let k = 0, timer = null;
  // Work out variables and console output at every step once, up front
  const states = [];
  { let vars = {}, out = [], pg = opts.page ? opts.page.slice() : null;
    tr.steps.forEach((s, i) => {
      if (s.vars) vars = Object.assign({}, s.vars); else if (s.v) vars = Object.assign({}, vars, s.v);
      const o = s.o === undefined ? [] : Array.isArray(s.o) ? s.o : [s.o];
      out = out.concat(o.map(x => [x, i]));
      if (s.dom) pg = s.dom; else if (s.pv && pg) pg = mergePage(pg, s.pv);
      states.push({ vars, out, newOut: o, page: pg });

    '<div class="st-ctrl"><button class="btn small" data-a="reset">Restart</button><button class="btn small" data-a="prev" aria-label="Step back">←</button><button class="btn small signal" data-a="play">▶ Play</button><button class="btn primary small" data-a="next">Step →</button>' +
    '<label class="st-speed">Speed <select data-a="speed" aria-label="Playback speed"><option value="1400">Slow</option><option value="800" selected>Normal</option><option value="350">Fast</option></select></label><span class="st-count tnum"></span></div></div>';
  const speedSel = $('[data-a="speed"]', host), playBtn = $('[data-a="play"]', host);
  const g = opts.robot ? mountGrid($(".st-grid", host), opts.robot.map, opts.robot.dir) : null;
  function draw() {
    const s = tr.steps[k], st = states[k], prev = k ? states[k - 1].vars : {};
    if (g) g.jump(opts.robot.trace, (s.rt || 1) - 1);
    if (st.page) renderPage($(".st-pv", host), st.page, false);
    const changed = Object.keys(st.vars).filter(n => prev[n] !== st.vars[n]);
    const code = $(".st-code", host);
    code.innerHTML = lines.map((ln, i) => '<div class="ln' + (i === s.l ? " cur" : "") + '"><span class="no">' + (i + 1) + "</span><span>" + (hl(ln) || " ") + "</span></div>").join("");
    const cur = $(".ln.cur", code); if (cur && code.scrollHeight > code.clientHeight) cur.scrollIntoView({ block: "nearest" });
    let note = s.n;
    if (!note && st.newOut.length) note = "Prints " + st.newOut.join(", ") + ".";
    if (!note && changed.length) note = changed.map(n => n + (n in prev ? ": " + prev[n] + " → " + st.vars[n] : " is created: " + st.vars[n])).join(" · ");
    if (!note) note = s.l >= 0 ? "Line " + (s.l + 1) + " runs." : "Done.";
    $(".st-note", host).textContent = note;
    const keys = Object.keys(st.vars);
    $(".vt", host).innerHTML = keys.length ? keys.map(n => '<div class="vbox' + (changed.indexOf(n) >= 0 ? " changed" : "") + '"><div class="vn">' + esc(n) + '</div><div class="vv">' + esc(st.vars[n]) + "</div></div>").join("") : '<span class="muted small">None yet</span>';
    $(".console", host).innerHTML = st.out.length ? st.out.map(o => '<span class="' + (o[1] === k ? "new" : "") + '">' + esc(o[0]) + "</span>").join("\n") : '<span class="muted">(empty)</span>';
    $(".st-count", host).textContent = "Step " + (k + 1) + " of " + N;
    $('[data-a="prev"]', host).disabled = k === 0;
    $('[data-a="next"]', host).disabled = k === N - 1;
  }

  function stop() { if (timer) { clearInterval(timer); timer = null; } updatePlay(); }
  function play() {
    if (k >= N - 1) k = 0;
    clearInterval(timer);
    timer = setInterval(() => {
      if (!host.isConnected) return stop();
      if (k < N - 1) { k++; draw(); }

  }
  host.addEventListener("click", e => {
    const a = e.target.closest("[data-a]"); if (!a || a.tagName === "SELECT") return;
