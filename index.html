  };
  gate();
}

/* ---- Reactive test rigs: every test case draws a small piece of the machine from your code's real results ---- */
const pctOf = (v, max) => typeof v === "number" && isFinite(v) && max > 0 ? Math.max(0, Math.min(100, v / max * 100)) : 0;
const vbars = (items, max) => '<div class="vbars">' + items.map(([v, label, cls]) => '<div class="vbar' + (cls ? " " + cls : "") + '"><div class="vbar-t"><i style="height:' + pctOf(v, max) + '%"></i></div><small>' + esc(label) + "</small></div>").join("") + "</div>";
const rigOut = (txt, cls) => '<div class="rig-out' + (cls ? " " + cls : "") + '">' + esc(txt) + "</div>";
const chip = (txt, cls) => '<span class="rchip' + (cls ? " " + cls : "") + '">' + esc(txt) + "</span>";
const rv = (r, k) => r && r.report ? r.report[k] : undefined;
const retv = r => r && r.report && r.report.out ? r.report.out.v : undefined;
const said = r => r ? (r.logs.length ? r.logs.join(" ") : "(nothing printed)") : "?";
const CRYSTAL_COLS = ["#F07B6F", "#5BC98B", "#5CC2CB", "#F5CB74", "#E39BC4", "#9FE3F0", "#F09F4E"];
const crystalCol = name => CRYSTAL_COLS[[...String(name)].reduce((a, ch) => a + ch.charCodeAt(0), 0) % CRYSTAL_COLS.length];
// (case, run without error or null, raw run) → HTML. The case's `in` holds its inputs.
const SCENES = {
  math: (c, r) => { const [a, b, d] = c.in.cells, per = rv(r, "perRobot"), tot = rv(r, "total");
    return '<div class="rig-row">' + vbars([[a, "A"], [b, "B"], [d, "C"]], 30) + '<span class="rig-arrow">→</span>' + vbars([[per, "bot 1", "alt"], [per, "bot 2", "alt"]], 25) + "</div>" + rigOut(r ? "total " + show(tot) + " · each " + show(per) : "cells waiting"); },
  bool: (c, r) => { const g = rv(r, "canEnter");
    return '<div class="rig-row">' + pxImg("pilot", "rig-sprite") + '<div class="rig-tags">' + chip(c.in.badge ? "badge ✓" : "no badge", c.in.badge ? "ok" : "bad") + chip("level " + c.in.level) + '</div><div class="gate' + (g === true ? " open" : g === false ? " shut" : "") + '"><i></i><i></i></div></div>' + rigOut(!r ? "gate waiting" : g === true ? "gate opens" : g === false ? "gate stays shut" : "canEnter = " + show(g)); },
  if: (c, r) => { const w = r ? r.logs[0] : null;
    return '<div class="rig-row"><div class="thermo' + (c.in.t > 90 ? " hot" : c.in.t >= 60 ? " warm" : "") + '"><i style="height:' + pctOf(c.in.t, 100) + '%"></i></div><div class="rig-big">' + c.in.t + "°</div></div>" + rigOut(r ? said(r) : "alarm waiting", w === "OVERHEAT" ? "hot" : w === "WARM" ? "warm" : w === "COOL" ? "cool" : ""); },
  return: (c, r) => '<div class="receipt"><div><span>parts</span><b>' + c.in.parts + '</b></div><div class="tot"><span>price</span><b>' + (r ? esc(show(retv(r))) : "?") + "</b></div></div>",
  arrays: (c, r) => { const rack = r && Array.isArray(rv(r, "crystals")) ? rv(r, "crystals") : c.in.arr, f = rv(r, "first"), l = rv(r, "last");
    return '<div class="crystals">' + rack.map((n, i) => '<span class="cry' + (r && i === 0 && n === f ? " mark" : "") + (r && i === c.in.arr.length - 1 && n === l ? " mark" : "") + '" title="' + esc(String(n)) + '" style="--c:' + crystalCol(n) + '"></span>').join("") + "</div>" + rigOut(r ? "first " + show(f) + " · last " + show(l) + " · printed " + said(r) : rack.length + " on the rack"); },
  arrloop: (c, r) => { const arr = c.in.args[0], lim = c.in.args[1], max = Math.max(1, ...arr);
    return (arr.length ? vbars(arr.map(v => [v, String(v), lim !== undefined && v > lim ? "hi" : ""]), max) : '<div class="rig-empty">empty array</div>') + rigOut(c.in.fn + " → " + (r ? show(retv(r)) : "?")); },
  objects: (c, r) => {
    if (c.in.kind === "bot") { const b = rv(r, "bot");
      if (!b || typeof b !== "object") return '<div class="profile">' + pxImg("robot", "rig-sprite") + '<div class="rig-empty">' + (r ? "no bot object yet" : "profile waiting") + "</div></div>";
      return '<div class="profile">' + pxImg("robot", "rig-sprite") + "<div><b>" + esc(show(b.name, false)) + '</b><div class="pbar"><i style="width:' + pctOf(b.battery, 100) + '%"></i></div>' + (Array.isArray(b.skills) ? b.skills.slice(0, 4).map(s => chip(show(s, false))).join("") : "") + "</div></div>"; }
    return '<div class="profile">' + pxImg("robot", "rig-sprite") + '<div class="screen">' + (r ? esc(show(retv(r), false)) : "…") + "</div></div>"; },
  boss: (c, r) => '<div class="scan">' + vbars(c.in.lv.map(x => [x, String(x), x > 70 ? "hi" : ""]), 100) + '<div class="thresh" title="alert level 70"></div></div>' + rigOut(r ? show(retv(r)) : "scanner waiting"),
  fin1: (c, r) => '<div class="rig-row"><div class="tank"><i style="height:' + pctOf(c.in.f, 130) + '%"></i><span class="reserve" style="bottom:' + pctOf(10, 130) + '%"></span></div><div><div class="rig-big">' + c.in.f + "L</div><small>burns " + c.in.b + "/min</small></div></div>" + rigOut(r ? said(r) : "gauge waiting"),
  fin2: (c, r) => { const w = r ? r.logs[0] : null;
    return '<div class="rig-row"><div class="gauge" title="safe zone 95–105"><span class="safe"></span><i style="left:' + pctOf(c.in.p, 140) + '%"></i></div>' + chip(c.in.l ? "locked" : "unlocked") + '</div><div class="airlock' + (w === "OPEN" ? " open" : "") + '"><i></i><i></i></div>' + rigOut(r ? said(r) : "airlock waiting", w === "DANGER" ? "hot" : w === "OPEN" ? "cool" : w === "LOCKED" ? "warm" : ""); },
  fin4: (c, r) => { const v = retv(r);
    if (c.in.fn === "bestLevel") return '<div class="shields">' + [1, 2, 3, 4, 5].map(k => '<span class="' + (typeof v === "number" && k <= v ? "on" : "") + '">' + k + "</span>").join("") + "</div>" + rigOut(c.in.args[0] + " coins → level " + (r ? show(v) : "?"));
    if (c.in.fn === "canAfford") return '<div class="rig-row">' + chip(c.in.args[0] + " coins") + chip("level " + c.in.args[1]) + "</div>" + rigOut(!r ? "?" : v === true ? "can afford ✓" : v === false ? "too expensive ✗" : show(v), v === true ? "cool" : v === false ? "hot" : "");
    return '<div class="receipt"><div><span>level</span><b>' + c.in.args[0] + '</b></div><div class="tot"><span>cost</span><b>' + (r ? esc(show(v)) : "?") + "</b></div></div>"; },
  fin5: (c, r) => { const v = retv(r), tired = Array.isArray(v) ? v : [];
    return (c.in.crew.length ? '<div class="crew">' + c.in.crew.map(m => '<div class="' + (tired.indexOf(m.name) >= 0 ? "tired" : "") + '"><span>' + esc(m.name) + '</span><div class="pbar"><i style="width:' + m.energy + '%"></i></div></div>').join("") + "</div>" : '<div class="rig-empty">no crew</div>') + rigOut(c.in.fn + " → " + (r ? show(v) : "?")); }
};

/* ---- Stage 4: Challenge ---- */
function stageChallenge(host, L, idx) {
  if (!drillsDone(L)) {
    host.innerHTML = '<div class="panel"><h3>Challenge locked</h3><p>Finish the guided drills in Practise first. They cover exactly what this repair needs.</p>' + nextBtn("Go to the drills", 2) + "</div>";
    wireGoto(host); return;
  }
  const C = L.challenge, key = L.id + ":c", S = sess(L.id), done = store.done[L.id];
  const budget = HINT_BUDGET(idx);
  host.innerHTML = '<div class="stack-lg">' +
    '<div class="cols"><div class="brief brief-lg dialog">' + pxImg(C.scene === "robot" ? "robot" : L.id === "boss" ? "skull" : WORLD_ICONS[L.world], "portrait") + '<div><p class="eyebrow">Repair order</p><p>' + C.brief + "</p></div></div>" +
    '<div class="scene"><div class="scene-head"><span>' + esc(C.title) + '</span><span class="state-lamp" id="lamp"><i></i><span>Offline</span></span></div><div id="scene"></div></div></div>' +
    '<div class="panel"><h3>Your code</h3><div id="ced"></div><div class="toolbar"><button class="btn" id="crun">Run ▶</button><button class="btn primary" id="ccheck">Check solution</button><button class="btn signal small" id="ctrace">Trace my code</button><button class="btn small" id="creset">Reset</button><span class="hint-k">Ctrl + Enter checks</span></div>' +
    '<div id="cfeed" aria-live="polite" style="margin-top:16px"></div><div id="cout" style="margin-top:16px"></div><div id="ctrace-out" style="margin-top:16px"></div></div>' +
    '<div class="cols"><div class="panel"><h3>Test results</h3><div class="scroll-x"><table class="cases"><thead><tr><th>Test</th><th>Expected</th><th>Result</th></tr></thead><tbody id="cases"></tbody></table></div></div>' +
    '<div class="panel"><h3>Hints</h3><p class="muted small" style="margin-bottom:12px">' + budget + " hint" + (budget === 1 ? "" : "s") + " for this repair. Hints get scarcer as you go deeper into the station. Using one lowers the stars you can earn.</p><div class=\"hints\" id=\"hints\"></div><div class=\"toolbar\"><button class=\"btn small\" id=\"hintbtn\"></button><span id=\"revealwrap\"></span></div></div></div>" +
    "</div>";
  const ed = createEditor($("#ced", host), { value: store.drafts[key] ?? C.starter, id: "ed-" + L.id + "-c", minLines: 10, onRun: () => check(), onChange: v => { store.drafts[key] = v; save(); } });
  const sceneHost = $("#scene", host);
  let grid = null;
  function drawScene(state) {
    const on = state && state.pass;
    $("#lamp", host).className = "state-lamp" + (on ? " on" : "");
    $("#lamp span", host).textContent = on ? "Online" : "Offline";
    if (C.scene === "robot") { if (!grid) grid = mountGrid(sceneHost, C.cases[0].map, C.cases[0].dir); return; }
    if (C.scene === "terminal") { const lines = state && state.logs && state.logs.length ? esc(state.logs.join("\n")) : '<span class="dim">_ waiting for output…</span>'; sceneHost.innerHTML = '<div class="crt">' + lines + (on ? '\n\n<span>&gt; ACCESS GRANTED</span>' : "") + "</div>"; return; }
    if (C.scene === "door") { const code = state && state.report && state.report.doorCode !== undefined ? show(state.report.doorCode) : "----"; sceneHost.innerHTML = '<div class="doorframe' + (on ? " open" : "") + '"><div class="behind">VAULT OPEN</div><div class="leaf l"></div><div class="leaf r"></div><div class="keypad">doorCode: ' + esc(code) + "</div></div>"; return; }
    const n = C.cases.length, p = state && state.passed !== undefined ? state.passed : 0;
    const status = '<div class="crt rig-status">' + (state && state.results ? (on ? "ALL " + n + " CHECKS PASSED · machine restored" : p + " / " + n + " checks passing · repair incomplete") : state && state.runs ? "Test run on rig 1 · press Check solution to power every rig" : '<span class="dim">' + n + " test rig" + (n > 1 ? "s" : "") + " connected. Run a check to power them.</span>") + "</div>";
    if (C.scene === "page") {
      if (state && state.live) return; // the live preview is already on screen
      if (state && state.results) {
        // One small copy of the panel per test, showing exactly how your code left it
        sceneHost.innerHTML = status + '<div class="rig-grid">' + C.cases.map((c, i) => {
          const res = state.results[i], r = state.runs[i];
          return '<div class="rig ' + (res.ok ? "ok" : "bad") + '"><div class="rig-h"><span>' + esc(c.label) + '</span><i class="rig-lamp" aria-label="' + (res.ok ? "passed" : "failed") + '"></i></div><div class="rig-b"><div class="mini-pv" data-case="' + i + '"></div>' + (r.error ? '<div class="rig-out bad">' + esc(r.error.name) + "</div>" : "") + "</div></div>";
        }).join("") + "</div>";
        C.cases.forEach((c, i) => { const h = $('.mini-pv[data-case="' + i + '"]', sceneHost); if (h) renderPage(h, state.runs[i].dom || c.page || C.page, false); });
        return;
      }
      sceneHost.innerHTML = '<div class="pv-wrap"></div><p class="pv-note">' + (state && state.passed === n ? "Repaired. Press Run to play with your panel again." : "Press Run to try your code on this panel. Its buttons work after Run.") + "</p>";
      renderPage($(".pv-wrap", sceneHost), C.cases[0].page || C.page, false);
      return;
    }
    const vis = SCENES[L.id];
    if (!vis) { sceneHost.innerHTML = status; return; }
    // One mini scene per test case, drawn from that case's input and what your code produced
    sceneHost.innerHTML = status + '<div class="rig-grid">' + C.cases.map((c, i) => {
      const r = state && state.runs ? state.runs[i] : null, res = state && state.results ? state.results[i] : null;
      let body; try { body = vis(c, r && !r.error ? r : null, r); } catch (_) { body = '<div class="rig-out">?</div>'; }
      return '<div class="rig ' + (res ? (res.ok ? "ok" : "bad") : r ? "ran" : "idle") + '"><div class="rig-h"><span>' + esc(c.label) + '</span><i class="rig-lamp" aria-label="' + (res ? (res.ok ? "passed" : "failed") : "not checked") + '"></i></div><div class="rig-b">' + body + (r && r.error ? '<div class="rig-out bad">' + esc(r.error.name) + "</div>" : "") + "</div></div>";
    }).join("") + "</div>";
  }
  function drawCases(results) {
    $("#cases", host).innerHTML = C.cases.map((c, i) => {
      const r = results && results[i];
      return "<tr><td><code>" + esc(c.label) + "</code></td><td><code>" + esc(c.expect) + "</code></td><td>" + (r ? '<span class="res ' + (r.ok ? "ok" : "bad") + '">' + (r.ok ? "Pass" : "Fail") + "</span>" + (r.got !== undefined && !r.ok ? '<br><code class="small">' + esc(r.got) + "</code>" : "") : '<span class="res wait">Not run</span>') + "</td></tr>";
    }).join("");
  }
  function drawHints() {
    $("#hints", host).innerHTML = C.hints.slice(0, S.hints).map((t, i) => '<div class="hint"><b>Hint ' + (i + 1) + ".</b> " + t + "</div>").join("");
    const b = $("#hintbtn", host);
    b.textContent = S.hints < budget ? "Show hint " + (S.hints + 1) + " of " + budget : "No hints left";
    b.disabled = S.hints >= budget;
    const rw = $("#revealwrap", host);
    if (S.revealed) rw.innerHTML = '<div style="margin-top:10px"><span class="label">Worked solution</span>' + codeBlock(C.solution) + '<p class="muted small" style="margin-top:6px">Read it line by line, then type or adapt it yourself and check again. Revealing the solution caps this repair at 1 star.</p></div>';
    else if (S.fails >= 3) { rw.innerHTML = '<button class="btn small" id="reveal">Show a worked solution (max 1 star)</button>'; $("#reveal", host).onclick = () => { S.revealed = true; save(); drawHints(); }; }
    else rw.innerHTML = "";
  }
  $("#hintbtn", host).onclick = () => { if (S.hints < budget) { S.hints++; save(); drawHints(); } };
  $("#creset", host).onclick = () => { ed.set(C.starter); };
  async function run() {
    const c = C.cases[0];
    if (C.scene === "page") {
      // A live panel: the learner can click its buttons to try their handlers
      sceneHost.innerHTML = '<div class="pv-wrap"></div><p class="pv-note">Live panel: click its buttons to test your handlers. Check solution runs the full tests.</p>';
      drawScene({ live: true, pass: !!store.done[L.id] });
      await livePreview($(".pv-wrap", sceneHost), $("#cout", host), ed).start(ed.get(), c.pre || "", c.page || C.page);
      return;
    }
    $("#cout", host).innerHTML = '<p class="muted small">Running…</p>';
    const r = await runOnce({ code: ed.get(), pre: c.pre || "", post: c.post || "", map: c.map || null, dir: c.dir });
    renderResult($("#cout", host), r, ed);
    if (grid && r.robot) grid.play(r.robot.trace);
    if (C.scene === "terminal") drawScene({ logs: r.logs });
    if (C.scene === "rig" || C.scene === "door") drawScene({ runs: [r], logs: r.logs, report: r.report });
  }
  async function check() {
    const code = ed.get();
    $("#cfeed", host).innerHTML = '<p class="muted small">Checking ' + C.cases.length + " test" + (C.cases.length > 1 ? "s" : "") + "…</p>";
    S.attempts++;
    const ev = await evaluate(code, C);
    const { runs, results, showIdx, passed, allOk } = ev;
    renderResult($("#cout", host), runs[showIdx], ed);
    if (C.cases.length > 1) $("#cout", host).insertAdjacentHTML("afterbegin", '<p class="muted small" style="margin-bottom:4px">Showing output from test: <code>' + esc(C.cases[showIdx].label) + "</code></p>");
    if (grid) { grid = mountGrid(sceneHost, C.cases[showIdx].map, C.cases[showIdx].dir); if (runs[showIdx].robot) grid.play(runs[showIdx].robot.trace); }
    drawCases(results);
    drawScene({ pass: allOk, logs: runs[0].logs, report: runs[0].report, passed, runs, results });
    if (allOk) {
      const stars = S.revealed ? 1 : (S.hints === 0 && S.attempts <= 2) ? 3 : (S.hints <= 1 && S.attempts <= 4) ? 2 : 1;
      const prev = store.done[L.id];
      const best = Math.max(stars, prev ? prev.stars : 0);
      // Keep the stats of the best run, so a weaker replay never hides earlier success (or struggle)
      const run = { stars, code, hints: S.hints, attempts: S.attempts, revealed: S.revealed, at: Date.now() };
      store.done[L.id] = !prev || stars >= prev.stars ? Object.assign({}, prev, run, { stars: best }) : Object.assign({}, prev, { stars: best });
      if (S.fails >= 3) store.stats.comebacks = (store.stats.comebacks || 0) + 1;
      store.sess[L.id] = { attempts: 0, hints: 0, revealed: false, fails: 0 };
      Object.assign(S, store.sess[L.id]);
      save(); renderStatus(); celebrate();
      setTimeout(() => checkAchievements(), 900);
      $("#cfeed", host).innerHTML = '<div class="okbox"><h4>Machine repaired</h4>' + pxStars(stars, true) + "<p>" + (stars === 3 ? "Clean repair: no hints and hardly any retries." : stars === 2 ? "Solid work. Solve it with no hints and at most 2 checks for 3 stars." : "Repaired. Replay later without hints to earn more stars.") + (prev && prev.stars > stars ? " Your best of " + prev.stars + " stars is kept." : "") + '</p><div class="toolbar"><button class="btn primary" id="toreview">See why it works →</button></div></div>';
      $("#toreview", host).onclick = () => { view.stage = 4; render(); window.scrollTo({ top: 0 }); };
      stageTab(4).disabled = false; stageTab(3).classList.add("ok");
    } else {
      S.fails++; save();
      $("#cfeed", host).innerHTML = '<div class="errbox"><p>' + failMessage(ev, C) + "</p>" + (S.fails >= 3 && !S.revealed ? '<p class="small">Stuck? You can reveal a worked solution in the hints panel.</p>' : "") + "</div>";
      drawHints();
    }
  }
  $("#crun", host).onclick = run;
  $("#ccheck", host).onclick = check;
  // Tracing uses the first test case's inputs, like Run. It never counts as an attempt.
  $("#ctrace", host).onclick = async () => {
    const c = C.cases[0];
    const res = await showTrace($("#ctrace-out", host), ed.get(), { pre: c.pre || "", map: c.map || null, dir: c.dir, page: c.page || C.page || null });
    renderResult($("#cout", host), res, ed);
    if (C.cases.length > 1) $("#ctrace-out", host).insertAdjacentHTML("afterbegin", '<p class="muted small" style="margin-bottom:6px">Tracing with the inputs of test <code>' + esc(c.label) + "</code>.</p>");
  };
  drawScene(done ? { pass: true, passed: C.cases.length, logs: [] } : null);
  drawCases(null); drawHints();
  if (done) $("#cfeed", host).innerHTML = '<div class="okbox"><p><b>Already repaired with ' + done.stars + " star" + (done.stars > 1 ? "s" : "") + ".</b> You can solve it again to improve your score, or continue to the review.</p></div>";
}

/* ---- Stage 5: Review ---- */
function stageReview(host, L, idx) {
  const d = store.done[L.id], C = L.challenge;
  if (!d) { host.innerHTML = '<div class="panel"><p>Repair the machine in the Challenge stage to unlock the review.</p>' + nextBtn("Go to the challenge", 3) + "</div>"; wireGoto(host); return; }
  const next = LESSONS[idx + 1];
  const solLines = C.solution.split("\n");
  const canReview = !isFinale(L) && REVIEWS[L.id];
  host.innerHTML = '<div class="cols"><div class="stack"><div class="okbox"><h4>' + esc(C.title) + ': complete</h4>' + pxStars(d.stars, true) + '<p>+' + repairXP(L, d) + " XP toward your rank" + (isFinale(L) ? ", including the 50 XP finale bonus" : "") + ".</p>" +
    (canReview ? '<p class="small">Mastery: <b>' + MASTERY[masteryOf(L)] + "</b>" + (masteryOf(L) < 4 ? ". A short review exercise raises it to Mastered." : ".") + '</p><div class="toolbar" style="margin-top:4px"><button class="btn small" id="toreviewex">' + (d.reviewed ? "Practise it again" : "Take the review exercise") + "</button></div>" : "") + "</div>" +
    '<div class="panel"><h3>Your solution</h3>' + codeBlock(d.code) + '<p class="muted small" style="margin-top:8px">Your version doesn\'t have to match the model below. If every test passed, it works. Compare the two to see other ways of writing the same idea.</p></div>' +
    '<div class="panel"><h3>What you learned</h3><ul class="mistakes">' + L.recap.map(r => "<li>" + r + "</li>").join("") + "</ul></div></div>" +
    '<div class="stack"><div class="panel"><h3>Why the model solution works</h3><div class="scroll-x"><table class="explain"><tbody>' + solLines.map((ln, i) => "<tr><td>" + (hl(ln) || " ") + "</td><td>" + esc(C.why[i] || "") + "</td></tr>").join("") + "</tbody></table></div></div>" +
    '<div class="panel"><h3>Watch out for</h3><ul class="mistakes">' + L.mistakes.slice(0, 2).map(m => "<li>" + m + "</li>").join("") + "</ul></div></div></div>" +
    '<div class="next-row"><button class="btn" id="tomap">Station map</button>' + (next ? '<button class="btn primary" id="tonext">Next: ' + esc(next.title) + " →</button>" : '<span class="pill ok" style="align-self:center">Station fully repaired</span>') + "</div>";
  $("#tomap", host).onclick = () => go({ name: "map" });
  const tn = $("#tonext", host); if (tn) tn.onclick = () => go({ name: "lesson", i: idx + 1, stage: 0 });
  const rv = $("#toreviewex", host); if (rv) rv.onclick = () => go({ name: "review", i: idx });
}

/* ================= How to play: a short tour, opened from the welcome card or the top bar ================= */
const TOUR = [
  { icon: "pilot", title: "Welcome to Station Nine", body: "You're the station's new rookie programmer. Machines are failing, and every repair is a small JavaScript program you write yourself. No experience needed: each repair teaches exactly one new idea." },
  { icon: "terminal", title: "Five stages per repair", body: "<b>Learn</b> the idea in plain words, <b>Visualise</b> it running line by line, <b>Practise</b> with guided drills, take on the <b>Challenge</b>, then <b>Review</b> why your solution works. Pass the drills to unlock the challenge.",
    demo: '<div class="tour-strip">' + ["Learn", "Visualise", "Practise", "Challenge", "Review"].map((s, i) => "<span>" + (i + 1) + ". " + s + "</span>").join("") + "</div>" },
  { icon: "robot", title: "Writing and running code", body: "Type in the dark code editor. <b>Run</b> shows what your code does. <b>Check</b> tests it against the repair order. <b>Trace my code</b> replays it one line at a time so you can watch every variable change. Errors are explained in plain English, with the line marked in red. On a phone, a row of symbol buttons sits above the editor.",
    demo: '<div class="tour-tools" aria-hidden="true"><span class="btn">Run ▶</span><span class="btn primary">Check solution</span><span class="btn signal">Trace my code</span></div>' },
  { icon: "star", title: "Stars, hints and help", body: "Repair a machine with no hints in two checks or fewer for 3 stars. Challenge hints cost stars, but drill hints are free. After 3 failed checks you can reveal a worked solution, then type it yourself. Every finished repair adds XP toward your next rank.",
    demo: '<div class="tour-stars">' + pxStars(3, true) + "</div>" },
  { icon: "trophy", title: "Your progress", body: "Progress saves automatically in this browser. Each sector ends with a finale that combines its ideas. Concepts you struggled with go into a review queue, and achievements mark your milestones. Use <b>Copy save code</b> at the bottom of the map to back everything up." }
];
function openTour() {
  if ($(".tour-ov")) return;
  const prevFocus = document.activeElement;
  const ov = document.createElement("div");
  ov.className = "tour-ov";
  ov.innerHTML = '<div class="tour" role="dialog" aria-modal="true" aria-labelledby="tour-t"><div class="tour-body"></div><div class="tour-nav"><button class="btn small" data-t="skip">Close</button><span class="tour-dots" aria-hidden="true"></span><button class="btn small" data-t="back">← Back</button><button class="btn primary small" data-t="next">Next →</button></div></div>';
  document.body.appendChild(ov);
  let i = 0;
  function draw() {
    const s = TOUR[i];
    $(".tour-body", ov).innerHTML = '<div class="tour-head">' + pxImg(s.icon, "tour-icon") + '<div><p class="eyebrow">How to play · ' + (i + 1) + " of " + TOUR.length + '</p><h2 id="tour-t">' + s.title + "</h2></div></div><p>" + s.body + "</p>" + (s.demo || "");
    $(".tour-dots", ov).innerHTML = TOUR.map((_, k) => "<i" + (k === i ? ' class="on"' : "") + "></i>").join("");
    $('[data-t="back"]', ov).disabled = i === 0;
    $('[data-t="next"]', ov).textContent = i === TOUR.length - 1 ? (Object.keys(store.done).length ? "Back to the game" : "Start the first lesson →") : "Next →";
    $('[data-t="next"]', ov).focus();
  }
  function close(startLesson) {
    ov.remove();
    if (!store.seenIntro) { store.seenIntro = true; save(); }
    document.removeEventListener("keydown", onKey, true);
    if (startLesson) go({ name: "lesson", i: 0, stage: 0 });
    else { if (view.name === "map") render(); if (prevFocus && prevFocus.focus) prevFocus.focus(); }
  }
  function onKey(e) {
    if (e.key === "Escape") { e.preventDefault(); close(false); return; }
    if (e.key === "Tab") { // keep keyboard focus inside the dialog
      const f = $$("button:not(:disabled)", ov); if (!f.length) return;
      const at = f.indexOf(document.activeElement);
      if (e.shiftKey && at <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && at === f.length - 1) { e.preventDefault(); f[0].focus(); }
    }
  }
  document.addEventListener("keydown", onKey, true);
  ov.addEventListener("click", e => {
    if (e.target === ov) return close(false);
    const b = e.target.closest("[data-t]"); if (!b) return;
    if (b.dataset.t === "skip") close(false);
    else if (b.dataset.t === "back" && i > 0) { i--; draw(); }
    else if (b.dataset.t === "next") { if (i < TOUR.length - 1) { i++; draw(); } else close(!Object.keys(store.done).length); }
  });
  draw();
}
$("#help-btn").onclick = openTour;

$("#ver").textContent = "Version " + APP_VERSION;
// Award anything already earned by progress made before achievements existed (before the first render, so the map shows them)
(function () {
  const earned = checkAchievements(true);
  render();
  if (earned.length) setTimeout(() => toast(pxImg("trophy") + "<div>" + earned.length + " achievement" + (earned.length === 1 ? "" : "s") + " unlocked<small>Earned by your progress so far. See them on the station map.</small></div>", { kind: "ach", ms: 5000 }), 600);
})();
</script>
