<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>JavaScript Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a station maintenance console. Sticky status bar, a sector map wired like a circuit, and each lesson as a five-stage workbench. */
:root {
  --bg: #E7ECF0;
  --panel: #F7F9FA;
  --panel-2: #DCE3E9;
  --ink: #15202B;
  --muted: #53637A;
  --line: #C2CCD6;
  --accent: #B4580E;
  --accent-ink: #FFFFFF;
  --accent-soft: #F4E0CB;
  --signal: #0E6A74;
  --signal-soft: #D2E9EB;
  --ok: #1C7A4B;
  --ok-soft: #D5ECDE;
  --bad: #AF372F;
  --bad-soft: #F5D9D5;
  --code-bg: #131E29;
  --code-ink: #DCE6EE;
  --code-muted: #6C8195;
  --code-line: #1E2D3B;
  --code-hi: #24384A;
  --t-k: #F2A65A; --t-s: #A3D98F; --t-n: #F5CB74; --t-c: #6C8195; --t-f: #7CC7E8; --t-o: #E39BC4; --t-p: #A8B6C3; --t-op: #F08A7E;
  --f-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, Consolas, "Courier New", monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151C; --panel: #151F29; --panel-2: #1C2834; --ink: #E1E8EE; --muted: #92A2B3; --line: #293745;
    --accent: #F09F4E; --accent-ink: #1A1006; --accent-soft: #3A2814; --signal: #5CC2CB; --signal-soft: #15333A;
    --ok: #5BC98B; --ok-soft: #14301F; --bad: #F07B6F; --bad-soft: #3A1D1A;
    --code-bg: #0A1016; --code-line: #15202A; --code-hi: #1D2E3D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151C; --panel: #151F29; --panel-2: #1C2834; --ink: #E1E8EE; --muted: #92A2B3; --line: #293745;
  --accent: #F09F4E; --accent-ink: #1A1006; --accent-soft: #3A2814; --signal: #5CC2CB; --signal-soft: #15333A;
  --ok: #5BC98B; --ok-soft: #14301F; --bad: #F07B6F; --bad-soft: #3A1D1A;
  --code-bg: #0A1016; --code-line: #15202A; --code-hi: #1D2E3D;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: .01em; }
p { margin: 0; }
code { font-family: var(--f-code); font-size: .88em; background: var(--panel-2); padding: .08em .35em; border-radius: 4px; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: .5em 1em; border-radius: var(--r); font-weight: 700; display: inline-flex; align-items: center; gap: .45em; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.signal { background: var(--signal); border-color: var(--signal); color: var(--panel); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: .3em .7em; font-size: .9em; }
.eyebrow { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .12em; font-size: .75rem; color: var(--muted); font-weight: 600; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; background: none; border: 0; color: var(--ink); padding: 0; }
.logo-mark { width: 34px; height: 34px; border-radius: 6px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--f-code); font-weight: 600; font-size: 14px; }
.logo b { font-family: var(--f-display); font-size: 1.2rem; letter-spacing: .02em; }
.status { margin-left: auto; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; font-size: .9rem; }
.rank { font-family: var(--f-display); font-weight: 600; }
.xpbar { width: 140px; height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--accent); }
.tnum { font-variant-numeric: tabular-nums; }

main { padding-block: 24px 64px; }

/* Map */
.hero { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 24px; align-items: stretch; margin-bottom: 28px; }
.hero h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); margin: 6px 0 12px; }
.hero p.lede { max-width: 60ch; color: var(--muted); font-size: 1.05rem; margin-bottom: 18px; }
.hero-card { background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 18px; font-family: var(--f-code); font-size: .85rem; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.hero-card .row { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--code-line); padding-bottom: 6px; }
.hero-card .row span:first-child { color: var(--code-muted); }
.loop-strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 32px; }
.loop-strip div { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; min-width: 0; }
.loop-strip b { display: block; font-family: var(--f-display); font-size: .95rem; }
.loop-strip small { color: var(--muted); font-size: .82rem; line-height: 1.35; display: block; }
.sector { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 20px; padding-block: 20px; border-top: 1px solid var(--line); }
.sector h3 { font-size: 1.3rem; margin: 4px 0 6px; }
.sector p { color: var(--muted); font-size: .92rem; }
.nodes { display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch; position: relative; }
.node { position: relative; width: 210px; max-width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; color: var(--ink); display: flex; flex-direction: column; gap: 4px; }
.node:not(:last-child)::after { content: ""; position: absolute; right: -15px; top: 50%; width: 14px; height: 2px; background: var(--line); }
.node .lv { font-family: var(--f-code); font-size: .75rem; color: var(--muted); }
.node b { font-family: var(--f-display); font-size: 1.05rem; }
.node small { color: var(--muted); font-size: .85rem; }
.node .stars { margin-top: auto; padding-top: 6px; letter-spacing: 2px; color: var(--accent); font-size: .95rem; }
.node.available { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.node.done { border-color: var(--ok); }
.node.done:not(:last-child)::after { background: var(--ok); }
.node.locked { opacity: .55; cursor: not-allowed; }
.node:not(.locked):hover { transform: translateY(-1px); }
.pill { display: inline-block; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border-radius: 99px; background: var(--panel-2); color: var(--muted); width: fit-content; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.go { background: var(--accent-soft); color: var(--accent); }

/* Lesson */
.lesson-head { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 16px; flex-wrap: wrap; }
.lesson-head h2 { font-size: clamp(1.7rem, 3.5vw, 2.4rem); margin: 4px 0; }
.lesson-head .concept { color: var(--muted); }
.stages { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: 24px; }
.stage-tab { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: var(--r); padding: 8px 10px; text-align: left; display: flex; flex-direction: column; min-width: 0; }
.stage-tab span { font-family: var(--f-code); font-size: .72rem; }
.stage-tab b { font-family: var(--f-display); color: var(--ink); font-size: 1rem; }
.stage-tab.active { border-color: var(--ink); background: var(--ink); }
.stage-tab.active b, .stage-tab.active span { color: var(--bg); }
.stage-tab.ok b::after { content: " ✓"; color: var(--ok); }
.stage-tab.active.ok b::after { color: var(--bg); }
.stage-tab:disabled { opacity: .5; cursor: not-allowed; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; min-width: 0; }
.panel h3 { font-size: 1.15rem; margin-bottom: 10px; }
.panel h4 { font-size: .95rem; margin-bottom: 6px; }
.prose { max-width: 68ch; display: flex; flex-direction: column; gap: 10px; }
.prose h3 { font-size: 1.25rem; margin-top: 8px; }
.brief { border-left: 3px solid var(--signal); background: var(--signal-soft); padding: 12px 16px; border-radius: 0 var(--r) var(--r) 0; }
.brief .eyebrow { color: var(--signal); }
.terms { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; }
.terms dt { font-weight: 700; }
.terms dd { margin: 0; color: var(--muted); }
table.explain { width: 100%; border-collapse: collapse; font-size: .93rem; }
table.explain td { border-top: 1px solid var(--line); padding: 8px 10px; vertical-align: top; }
table.explain td:first-child { white-space: pre; font-family: var(--f-code); font-size: .84rem; background: var(--code-bg); color: var(--code-ink); width: 1%; }
.scroll-x { overflow-x: auto; max-width: 100%; }
.compare { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.compare > div { border-radius: 8px; padding: 12px; min-width: 0; }
.compare .good { background: var(--ok-soft); }
.compare .bad { background: var(--bad-soft); }
.compare .tag { font-family: var(--f-display); font-weight: 700; font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; }
.compare .good .tag { color: var(--ok); }
.compare .bad .tag { color: var(--bad); }
.compare p { font-size: .9rem; margin-top: 8px; }
ul.mistakes { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.next-row { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 8px; }

/* Code */
pre.code { margin: 0; background: var(--code-bg); color: var(--code-ink); font-family: var(--f-code); font-size: .88rem; line-height: 1.6; padding: 12px 14px; border-radius: 8px; overflow-x: auto; white-space: pre; }
.k { color: var(--t-k); } .s { color: var(--t-s); } .n { color: var(--t-n); } .c { color: var(--t-c); font-style: italic; } .f { color: var(--t-f); } .o { color: var(--t-o); } .p { color: var(--t-p); } .op { color: var(--t-op); }

/* Editor */
.editor { display: flex; background: var(--code-bg); border-radius: 8px; overflow: auto; max-height: 460px; border: 1px solid var(--code-line); }
.gutter { position: sticky; left: 0; z-index: 2; background: var(--code-bg); border-right: 1px solid var(--code-line); padding: 12px 8px 12px 10px; font-family: var(--f-code); font-size: .88rem; line-height: 1.6; color: var(--code-muted); text-align: right; user-select: none; display: flex; flex-direction: column; min-width: 2.6em; }
.gutter span.err { color: var(--code-bg); background: var(--t-op); border-radius: 3px; padding-inline: 3px; }
.ed-wrap { position: relative; flex: 1; min-width: 0; display: inline-block; }
.ed-hl, .ed-ta { margin: 0; padding: 12px 14px; font-family: var(--f-code); font-size: .88rem; line-height: 1.6; white-space: pre; tab-size: 2; letter-spacing: 0; word-spacing: 0; border: 0; }
.ed-hl { color: var(--code-ink); min-height: 100%; pointer-events: none; min-width: max-content; }
.ed-ta { position: absolute; inset: 0; width: 100%; height: 100%; resize: none; overflow: hidden; background: transparent; color: transparent; caret-color: #FFFFFF; outline: none; }
.ed-ta::selection { background: rgba(124, 199, 232, .35); color: transparent; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.toolbar .hint-k { margin-left: auto; color: var(--muted); font-size: .8rem; }
pre.console { margin: 0; background: var(--code-bg); color: #CFE8D2; font-family: var(--f-code); font-size: .85rem; line-height: 1.55; padding: 10px 14px; border-radius: 8px; min-height: 3.4em; max-height: 240px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
pre.console .muted { color: var(--code-muted); }
pre.console .new { color: #FFFFFF; background: var(--code-hi); }
.errbox { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.errbox .etype { font-family: var(--f-code); color: var(--bad); font-weight: 600; font-size: .9rem; word-break: break-word; }
.okbox { border: 1px solid var(--ok); background: var(--ok-soft); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.okbox h4 { color: var(--ok); font-size: 1.1rem; }
.label { font-family: var(--f-display); font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; margin-bottom: 4px; display: block; }

/* Stepper */
.stepper { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; }
.st-code { background: var(--code-bg); border-radius: 8px; padding: 10px 0; font-family: var(--f-code); font-size: .88rem; line-height: 1.6; color: var(--code-ink); overflow-x: auto; min-width: 0; }
.st-code .ln { display: flex; white-space: pre; padding-right: 14px; border-left: 3px solid transparent; }
.st-code .ln .no { width: 2.6em; text-align: right; padding-right: 12px; color: var(--code-muted); flex: none; }
.st-code .ln.cur { background: var(--code-hi); border-left-color: var(--accent); }
.st-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.st-note { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; min-height: 4.6em; font-size: .95rem; }
.vt { display: flex; flex-wrap: wrap; gap: 8px; }
.vbox { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; min-width: 70px; background: var(--panel); }
.vbox .vn { font-family: var(--f-code); font-size: .75rem; background: var(--panel-2); padding: 2px 8px; color: var(--muted); }
.vbox .vv { font-family: var(--f-code); font-size: .9rem; padding: 4px 8px; word-break: break-word; }
.vbox.changed { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.vbox.locked .vn::after { content: " · const"; }
.st-ctrl { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.st-count { color: var(--muted); font-size: .88rem; margin-inline: auto; }

/* Widgets */
.widget { display: flex; flex-direction: column; gap: 12px; }
.wrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: .82rem; color: var(--muted); }
.field input, .field select { font: inherit; font-size: .95rem; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; min-width: 0; }
.field input[type="text"], .field input[type="number"] { width: 9em; }
.field input[type="range"] { width: 220px; max-width: 100%; padding: 0; }
.lamp { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-code); font-weight: 600; padding: 6px 12px; border-radius: 99px; background: var(--panel-2); }
.lamp i { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); }
.lamp.t { background: var(--ok-soft); color: var(--ok); } .lamp.t i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.lamp.f { background: var(--bad-soft); color: var(--bad); } .lamp.f i { background: var(--bad); }
.slots { display: flex; gap: 6px; flex-wrap: wrap; }
.slot { border: 1px solid var(--line); border-radius: 6px; min-width: 76px; text-align: center; background: var(--panel); overflow: hidden; }
.slot .si { background: var(--panel-2); font-family: var(--f-code); font-size: .75rem; color: var(--muted); padding: 2px; }
.slot .sv { font-family: var(--f-code); padding: 8px 6px; }
.slot.hit { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.machine { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.3fr) auto minmax(0, 1fr); gap: 10px; align-items: center; }
.machine .mbox { border: 1px dashed var(--line); border-radius: 8px; padding: 10px; font-family: var(--f-code); font-size: .85rem; min-width: 0; word-break: break-word; }
.machine .mbox.core { border-style: solid; border-color: var(--signal); background: var(--signal-soft); }
.machine .arrow { color: var(--muted); font-size: 1.2rem; }

/* Challenge */
.scene { background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.scene-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--f-display); font-size: .85rem; letter-spacing: .1em; text-transform: uppercase; color: var(--code-muted); }
.state-lamp { display: inline-flex; align-items: center; gap: 6px; color: var(--code-ink); }
.state-lamp i { width: 10px; height: 10px; border-radius: 50%; background: #E0645A; box-shadow: 0 0 8px #E0645A; }
.state-lamp.on i { background: #5BC98B; box-shadow: 0 0 10px #5BC98B; }
.crt { background: #071009; border-radius: 8px; padding: 14px; min-height: 120px; font-family: var(--f-code); color: #7FE0A0; font-size: .95rem; text-shadow: 0 0 6px rgba(127, 224, 160, .45); white-space: pre-wrap; word-break: break-word; }
.crt .dim { color: #3F6E4E; text-shadow: none; }
.doorframe { position: relative; height: 170px; border-radius: 8px; background: #071009; overflow: hidden; display: grid; place-items: center; }
.doorframe .behind { font-family: var(--f-display); color: #5BC98B; font-size: 1.2rem; letter-spacing: .15em; }
.leaf { position: absolute; top: 0; bottom: 0; width: 50%; background: repeating-linear-gradient(135deg, #2C3A46 0 14px, #26333E 14px 28px); border: 2px solid #3B4C5B; transition: transform .9s cubic-bezier(.6, 0, .2, 1); }
.leaf.l { left: 0; } .leaf.r { right: 0; }
.doorframe.open .leaf.l { transform: translateX(-100%); } .doorframe.open .leaf.r { transform: translateX(100%); }
.keypad { position: absolute; z-index: 2; right: 12px; top: 12px; background: #0B1117; border: 1px solid #3B4C5B; border-radius: 6px; padding: 6px 10px; font-family: var(--f-code); font-size: .8rem; color: var(--t-n); }
.grid-host { display: flex; justify-content: center; }
.grid { position: relative; display: grid; grid-template-columns: repeat(var(--cols), 1fr); width: min(100%, calc(var(--cols) * 44px)); aspect-ratio: var(--cols) / var(--rows); max-width: 100%; border-radius: 6px; overflow: hidden; }
.cell { border: 1px solid #0B1117; }
.cell.wall { background: repeating-linear-gradient(45deg, #2A3743 0 6px, #24303A 6px 12px); }
.cell.floor { background: #18242F; }
.cell.goal { background: #18242F; box-shadow: inset 0 0 0 3px #5BC98B; position: relative; }
.cell.goal::after { content: "EXIT"; position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-code); font-size: 9px; color: #5BC98B; }
.bot { position: absolute; display: grid; place-items: center; transition: left .2s linear, top .2s linear, transform .2s linear; }
.bot svg { width: 72%; height: 72%; }
.bot.crash { animation: shake .35s 2; }
@keyframes shake { 25% { translate: -3px 0; } 75% { translate: 3px 0; } }
.cases { width: 100%; border-collapse: collapse; font-size: .88rem; }
.cases th { text-align: left; font-family: var(--f-display); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; }
.cases td { border-top: 1px solid var(--line); padding: 7px 8px; vertical-align: top; }
.cases td code { white-space: pre-wrap; word-break: break-word; }
.res { font-weight: 700; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }

  if (/has already been declared|redeclaration/.test(m)) { const n = (m.match(/Identifier '([^']+)'/) || [])[1]; return "You created " + (n ? "<code>" + esc(n) + "</code>" : "the same name") + " twice. A variable is created once with <code>let</code> or <code>const</code>. To change it later, leave the keyword out. If the challenge says a variable already exists, don't create it again."; }
  if (/Unexpected token|Unexpected identifier|Unexpected string|Unexpected number|expected expression|unexpected token/i.test(m)) return "JavaScript found a word or symbol it didn't expect at this point. Look for a missing bracket, quote, comma or <code>+</code> on this line or the line just above it. Inside a <code>for</code> loop's brackets the three parts are separated by semicolons <code>;</code>, not commas.";
  if (/Assignment to constant variable|invalid assignment to const/.test(m)) return "You tried to change a variable made with <code>const</code>. Use <code>let</code> if its value needs to change.";
  if (/before initialization|can't access lexical declaration/.test(m)) return "You used a variable before the line that creates it. Code runs top to bottom, so move the <code>let</code>/<code>const</code> line above.";
  if (/is not a function/.test(m)) return "You put <code>( )</code> after something that isn't a function. Check the spelling of the name, and that you defined the function.";
  if (/Cannot read propert|Cannot set propert|is undefined|is null/.test(m)) return "You tried to look inside something that is <code>undefined</code>. This often happens when an array index is past the end, or a name is misspelled.";
  if (/More than 300 lines/.test(m)) return esc(m);
  return "Read the message above carefully: it names what went wrong. Then look at the line it points to and the line just before it.";
}

/* ================= Code editor ================= */
function createEditor(host, { value = "", minLines = 6, id, onRun, onChange }) {
  host.innerHTML = '<div class="editor"><div class="gutter" aria-hidden="true"></div><div class="ed-wrap"><pre class="ed-hl" aria-hidden="true"></pre><textarea class="ed-ta" id="' + id + '" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" aria-label="Code editor. Press Control Enter to run."></textarea></div></div>';
  const ta = $("textarea", host), pre = $(".ed-hl", host), gut = $(".gutter", host);
  let errLine = null;
  function render() {
    const v = ta.value;
    pre.innerHTML = hl(v) + "\n ";
    const n = Math.max(v.split("\n").length, minLines);
    let g = "";
    for (let i = 1; i <= n; i++) g += '<span class="' + (i === errLine ? "err" : "") + '">' + i + "</span>";
    gut.innerHTML = g;
    pre.style.minHeight = "calc(" + n + " * 1.6 * .88rem + 24px)";
  }
  function insert(t) {
    ta.focus();
    let ok = false;
    try { ok = document.execCommand("insertText", false, t); } catch (_) { ok = false; }
    if (!ok) { ta.setRangeText(t, ta.selectionStart, ta.selectionEnd, "end"); }
    errLine = null; render(); onChange && onChange(ta.value);
  }
  ta.addEventListener("input", () => { errLine = null; render(); onChange && onChange(ta.value); });
  ta.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); onRun && onRun(); return; }
    if (e.key === "Tab" && !e.shiftKey) { e.preventDefault(); insert("  "); return; }
    if (e.key === "Enter" && !e.shiftKey && !e.altKey) {
      const before = ta.value.slice(0, ta.selectionStart);
      const line = before.slice(before.lastIndexOf("\n") + 1);
      let ind = (line.match(/^\s*/) || [""])[0];
      if (/[{[(]\s*$/.test(line)) ind += "  ";
      e.preventDefault(); insert("\n" + ind);
    }
    if (e.key === "}" ) {
      const before = ta.value.slice(0, ta.selectionStart);
      const line = before.slice(before.lastIndexOf("\n") + 1);
      if (/^\s{2,}$/.test(line) && line.length >= 2) { e.preventDefault(); ta.setSelectionRange(ta.selectionStart - 2, ta.selectionStart); insert("}"); }
    }
  });
  ta.value = value; render();
  return {
    get: () => ta.value,
    set(v) { ta.value = v; errLine = null; render(); onChange && onChange(v); },
    mark(line) { errLine = line; render(); },
    focus: () => ta.focus()
  };
}

/* ================= Robot grid ================= */
const BOT_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L20 20 L12 16 L4 20 Z" fill="#F09F4E" stroke="#1A1006" stroke-width="1.2" stroke-linejoin="round"/><circle cx="12" cy="11" r="2.2" fill="#0B1117"/></svg>';
function mountGrid(host, map, dir = 1) {
  const rows = map.length, cols = map[0].length;
  let cells = "";
  map.forEach(r => [...r].forEach(ch => { cells += '<div class="cell ' + (ch === "#" ? "wall" : ch === "G" ? "goal" : "floor") + '"></div>'; }));
  host.innerHTML = '<div class="grid-host"><div class="grid" style="--cols:' + cols + ";--rows:" + rows + '" role="img" aria-label="Robot map">' + cells + '<div class="bot">' + BOT_SVG + "</div></div></div>";
  const bot = $(".bot", host);
  bot.style.width = 100 / cols + "%"; bot.style.height = 100 / rows + "%";
  let angle = dir * 90, token = 0;
  function place(st, instant) {
    if (instant) bot.style.transition = "none";
    bot.style.left = (st.x * 100 / cols) + "%"; bot.style.top = (st.y * 100 / rows) + "%";
    bot.style.transform = "rotate(" + angle + "deg)";
    if (instant) { void bot.offsetWidth; bot.style.transition = ""; }
  }
  let sx = 0, sy = 0;
  map.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === "R") { sx = x; sy = y; } }));
  function reset() { token++; angle = dir * 90; bot.classList.remove("crash"); place({ x: sx, y: sy }, true); }
  reset();
  async function play(trace) {
    const my = ++token;
    angle = dir * 90; bot.classList.remove("crash"); place({ x: sx, y: sy }, true);
    const fast = trace.length > 60 ? 70 : 230;
    for (let i = 1; i < trace.length; i++) {
      await sleep(fast);
      if (my !== token) return;
      const t = trace[i];
      if (t.ev === "left") angle -= 90;
      if (t.ev === "right") angle += 90;
      if (t.ev === "crash") { bot.classList.add("crash"); continue; }
      place(t);
    }
  }
  return { play, reset };
}

/* ================= Test helpers ================= */
const pass = got => ({ ok: true, got });
const fail = (msg, got) => ({ ok: false, msg, got });
const q = s => "<code>" + esc(s) + "</code>";
function expectLogs(logs, exp) {
  const got = logs.length ? logs.join("\n") : "(nothing printed)";
  if (!logs.length) return fail("Nothing was printed. Use <code>console.log(...)</code> to send a value to the console.", got);
  for (let i = 0; i < exp.length; i++) {
    const g = logs[i], x = exp[i];
    if (g === undefined) return fail("Line " + (i + 1) + " of the output is missing. Expected " + q(x) + ".", got);
    if (g !== x) {
      if (g.toLowerCase() === x.toLowerCase()) return fail("Line " + (i + 1) + " has different capital letters: got " + q(g) + ", expected " + q(x) + ". To a computer, A and a are different characters.", got);
      if (g.replace(/\s+/g, "") === x.replace(/\s+/g, "")) return fail("Line " + (i + 1) + " has extra or missing spaces: got " + q(g) + ", expected " + q(x) + ". Spaces inside quotes are printed exactly.", got);
      return fail("Line " + (i + 1) + " should be " + q(x) + " but was " + q(g) + ".", got);
    }
  }
  if (logs.length > exp.length) return fail("Too many lines: expected " + exp.length + ", got " + logs.length + ". Remove the extra <code>console.log</code> calls.", got);
  return pass(got);
}
const grab = (...names) => names.map(n => "__report[" + JSON.stringify(n) + "] = typeof " + n + " === 'undefined' ? undefined : " + n + ";").join(" ");
const callPost = (fn, args) => "__report.isFn = typeof " + fn + " === 'function'; if (__report.isFn) __report.out = __call(" + fn + (args.length ? ", " + args.map(a => JSON.stringify(a)).join(", ") : "") + ");";
function callCheck(R, name, callText, exp, tips) {
  if (!R.isFn) return fail("There is no function called <code>" + name + "</code>. Check the spelling, and that you wrote <code>function " + name + "(...)</code>.", "no function");
  if (R.out.err !== undefined) return fail("Calling " + q(callText) + " caused an error: " + esc(R.out.err), "error");
  const v = R.out.v;
  if (v === undefined) return fail(q(callText) + " returned <code>undefined</code>. The function needs a <code>return</code> statement. <code>console.log</code> only shows a value on screen; <code>return</code> hands it back to the code that called the function.", "undefined");
  if (!same(v, exp)) { const tip = tips ? tips(v) : ""; return fail(q(callText) + " returned " + q(show(v)) + " but should return " + q(show(exp)) + "." + (tip ? " " + tip : ""), show(v)); }
  return pass(show(v));
}
function robotCheck(r, extra) {
  if (!r.robot) return fail("The robot didn't run.", "—");
  if (r.robot.atGoal) return pass("on the exit");
  const tip = extra ? extra(r.robot) : "";
  return fail("B0-T stopped after " + r.robot.moves + " move" + (r.robot.moves === 1 ? "" : "s") + " without reaching the exit." + (tip ? " " + tip : ""), r.robot.moves + " moves, not on exit");
}
function corridor(n) { return ["#".repeat(n + 3), "#R" + ".".repeat(n - 1) + "G#", "#".repeat(n + 3)]; }

LESSONS.forEach(L => { L.drills = DRILLS[L.id] || []; });

/* ================= Progress store ================= */
const STORE_KEY = "js-quest-v1";
let store = { done: {}, drafts: {}, sess: {}, drills: {} };
try { const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); if (s && s.done) store = Object.assign(store, s); } catch (_) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (_) {} }
const xp = () => Object.values(store.done).reduce((a, d) => a + 100 + 25 * d.stars, 0);
const RANKS = [[0, "Rookie"], [300, "Apprentice"], [800, "Technician"], [1400, "Engineer"], [2000, "Architect"]];
function rankInfo() { const x = xp(); let i = 0; RANKS.forEach((r, k) => { if (x >= r[0]) i = k; }); const next = RANKS[i + 1]; return { x, name: RANKS[i][1], next, pct: next ? (x - RANKS[i][0]) / (next[0] - RANKS[i][0]) : 1 }; }
const unlocked = i => i === 0 || !!store.done[LESSONS[i - 1].id];
const sess = id => (store.sess[id] = store.sess[id] || { attempts: 0, hints: 0, revealed: false, fails: 0 });
const HINT_BUDGET = i => LESSONS[i].challenge.hints.length;

function renderStatus() {
  const r = rankInfo();
  const done = Object.keys(store.done).length, stars = Object.values(store.done).reduce((a, d) => a + d.stars, 0);
  $("#status").innerHTML = '<span><span class="rank">' + r.name + '</span> <span class="muted tnum">· ' + r.x + " XP</span></span>" +
    '<span class="xpbar" title="' + (r.next ? (r.next[0] - r.x) + " XP to " + r.next[1] : "Top rank") + '"><i style="width:' + Math.round(r.pct * 100) + '%"></i></span>' +
    '<span class="muted tnum">' + done + "/" + LESSONS.length + " repairs · ★ " + stars + "</span>";
}

/* ================= Views ================= */
const app = $("#app");
let view = { name: "map" };

$("#logo-btn").onclick = () => go({ name: "map" });

function renderMap() {
  const nextIdx = LESSONS.findIndex((l, i) => unlocked(i) && !store.done[l.id]);

    '<p class="lede">You\'re the station\'s new rookie programmer. Machines are failing across six sectors, and the only way to repair them is to write JavaScript. Each repair teaches one idea: you learn it, watch it run, experiment, then fix the machine yourself.</p>' +
    (ni ? '<button class="btn primary" id="continue">' + (Object.keys(store.done).length ? "Continue: " : "Start: ") + esc(ni.title) + " →</button>" : '<p class="okbox"><b>Every machine on the station is repaired.</b> Replay any lesson to improve your stars.</p>') +
    '</div><div class="hero-card" aria-label="Your progress"><div class="row"><span>pilot.rank</span><span>"' + r.name + '"</span></div><div class="row"><span>pilot.xp</span><span>' + r.x + '</span></div><div class="row"><span>repairs.done</span><span>' + Object.keys(store.done).length + " / " + LESSONS.length + '</span></div><div class="row"><span>next.rank</span><span>' + (r.next ? '"' + r.next[1] + '" @ ' + r.next[0] : "null") + '</span></div>' +

  h += '<div class="loop-strip" aria-label="How each lesson works">' + [["Learn", "One idea in plain words"], ["Visualise", "Step through code line by line"], ["Practise", "Guided drills, then free play"], ["Challenge", "Repair a machine with code"], ["Review", "Why your solution works"]].map((s, i) => '<div><b>' + (i + 1) + ". " + s[0] + "</b><small>" + s[1] + "</small></div>").join("") + "</div>";
  WORLDS.forEach((w, wi) => {

      h += '<button class="node ' + cls + '" data-i="' + i + '"' + (u ? "" : ' disabled aria-disabled="true"') + '><span class="lv">LESSON ' + String(i + 1).padStart(2, "0") + "</span><b>" + esc(l.title) + "</b><small>" + esc(l.concept) + "</small>" +
        (d ? '<span class="stars" aria-label="' + d.stars + ' of 3 stars">' + "★".repeat(d.stars) + "☆".repeat(3 - d.stars) + "</span>" : u ? '<span class="pill go" style="margin-top:auto">Ready</span>' : '<span class="pill" style="margin-top:auto">Locked</span>') + "</button>";

const STAGES = ["Learn", "Visualise", "Practise", "Challenge", "Review"];

const nextBtn = (label, stage) => '<div class="next-row"><button class="btn primary" data-goto="' + stage + '">' + label + " →</button></div>";

/* ---- Stage 1: Learn (three short pages) ---- */
const LEARN_PAGES = ["The idea", "Read the code", "Avoid mistakes"];

function mountStepper(host, tr) {

    '<div class="st-ctrl"><button class="btn small" data-a="reset">Restart</button><button class="btn small" data-a="prev">← Back</button><span class="st-count tnum"></span><button class="btn primary small" data-a="next">Step →</button></div></div>';
  function draw() {
    const vars = {}, out = []; let changed = {};
    for (let i = 0; i <= k; i++) { const s = tr.steps[i]; if (s.v) { Object.assign(vars, s.v); if (i === k) changed = s.v; } if (s.o !== undefined) out.push([s.o, i === k]); }

function renderResult(host, r, ed) {
  const out = r.logs && r.logs.length ? esc(r.logs.join("\n")) : '<span class="muted">(nothing printed)</span>';
  let h = '<span class="label">Console</span><pre class="console">' + out + "</pre>";
  if (r.error) {
    h += '<div class="errbox" style="margin-top:10px" role="alert"><span class="etype">' + esc(r.error.name) + ": " + esc(r.error.message) + (r.error.line ? " (line " + r.error.line + ")" : "") + "</span><p>" + explainError(r.error) + "</p></div>";
    if (ed && r.error.line) ed.mark(r.error.line);
  }
  host.innerHTML = h;
}

/* ---- Shared test engine (used by challenges and drills) ---- */
// Runs code against every case of a spec ({ cases, src? }) and gathers the verdicts.
async function evaluate(code, spec) {
  const src = stripComments(code);
  const runs = [];
  for (const c of spec.cases) runs.push(await runOnce({ code, pre: c.pre || "", post: c.post || "", map: c.map || null, dir: c.dir }));
  const results = runs.map((r, i) => r.error ? { ok: false, msg: null, got: r.error.name, err: r.error } : spec.cases[i].check(r, spec.cases[i], src));
  const firstErr = runs.findIndex(r => r.error);
  const showIdx = firstErr >= 0 ? firstErr : Math.max(0, results.findIndex(x => !x.ok));
  let srcFail = null;
  if (firstErr < 0 && results.every(x => x.ok) && spec.src) srcFail = spec.src.find(s => !s.test(src)) || null;
  const passed = results.filter(x => x.ok).length;
  return { src, runs, results, firstErr, showIdx, srcFail, passed, allOk: passed === results.length && !srcFail };
}
function failMessage(ev, spec) {
  const { runs, results, firstErr, srcFail, passed } = ev;
  if (firstErr >= 0) return "<b>Your code stopped with an error</b>" + (spec.cases.length > 1 ? " in test <code>" + esc(spec.cases[firstErr].label) + "</code>" : "") + ". The explanation is below the editor" + (runs[firstErr].error.line ? ", and line " + runs[firstErr].error.line + " is marked in red" : "") + ".";
  if (srcFail) return "<b>All tests produced the right result, but there's one more requirement.</b> " + srcFail.msg;
  const f = results.find(x => !x.ok);
  return "<b>" + passed + " of " + results.length + " tests pass.</b> " + f.msg;
}

/* ---- Guided drills ---- */
const drillDone = (L, k) => !!(store.drills[L.id] && store.drills[L.id][k]);
// A lesson's challenge unlocks once every drill passes. Lessons repaired before drills existed stay unlocked.
const drillsDone = L => !!store.done[L.id] || (L.drills || []).every((_, k) => drillDone(L, k));
function mountDrill(host, L, k, onPass) {
  const D = L.drills[k], key = L.id + ":d" + k, n = L.drills.length;
  let hintsShown = 0;
  host.innerHTML = '<div class="panel drill"><div class="drill-head"><div><p class="eyebrow">Drill ' + (k + 1) + " of " + n + "</p><h3>" + esc(D.title) + '</h3></div><span class="pill" data-st></span></div>' +
    '<p class="drill-task">' + D.task + "</p>" +
    (D.cases[0].map ? '<div class="scene" style="margin-bottom:14px"><div class="scene-head"><span>B0-T practice floor</span></div><div data-grid></div></div>' : "") +
    '<div data-ed></div><div class="toolbar"><button class="btn primary" data-a="check">Check drill</button><button class="btn small" data-a="hint">Show a hint</button><button class="btn small" data-a="reset">Reset</button><span class="hint-k">Ctrl + Enter checks</span></div>' +
    '<div class="hints" data-hints style="margin-top:12px"></div><div data-feed aria-live="polite" style="margin-top:12px"></div><div data-out style="margin-top:12px"></div></div>';
  const q = s => $("[" + s + "]", host);
  let grid = D.cases[0].map ? mountGrid(q("data-grid"), D.cases[0].map, D.cases[0].dir) : null;
  const ed = createEditor(q("data-ed"), { value: store.drafts[key] ?? D.starter, id: "ed-" + L.id + "-d" + k, minLines: 4, onRun: () => check(), onChange: v => { store.drafts[key] = v; save(); } });
  function status() { const ok = drillDone(L, k); const p = q("data-st"); p.className = "pill " + (ok ? "ok" : "go"); p.textContent = ok ? "Passed" : "To do"; }
  function drawHints() {
    q("data-hints").innerHTML = D.hints.slice(0, hintsShown).map((t, i) => '<div class="hint"><b>Hint ' + (i + 1) + ".</b> " + t + "</div>").join("");
    const b = $('[data-a="hint"]', host);
    b.textContent = hintsShown < D.hints.length ? (hintsShown ? "More specific hint" : "Show a hint") : "No more hints";
    b.disabled = hintsShown >= D.hints.length;
  }
  async function check() {
    const code = ed.get();
    const blanks = (stripComments(code).match(/___/g) || []).length;
    if (blanks) {
      const lines = code.split("\n").map((l, i) => /___/.test(l) ? i + 1 : 0).filter(Boolean);
      q("data-out").innerHTML = "";
      q("data-feed").innerHTML = '<div class="errbox"><p><b>' + blanks + " blank" + (blanks > 1 ? "s" : "") + " left to fill in.</b> Replace each <code>___</code> with your own code (line " + lines.join(", ") + ").</p></div>";
      ed.mark(lines[0]);
      return;
    }
    q("data-feed").innerHTML = '<p class="muted small">Checking…</p>';
    const ev = await evaluate(code, D);
    renderResult(q("data-out"), ev.runs[ev.showIdx], ed);
    if (D.cases.length > 1) q("data-out").insertAdjacentHTML("afterbegin", '<p class="muted small" style="margin-bottom:4px">Output from test: <code>' + esc(D.cases[ev.showIdx].label) + "</code></p>");
    if (grid) { grid = mountGrid(q("data-grid"), D.cases[ev.showIdx].map, D.cases[ev.showIdx].dir); if (ev.runs[ev.showIdx].robot) grid.play(ev.runs[ev.showIdx].robot.trace); }
    if (ev.allOk) {
      const first = !drillDone(L, k);
      (store.drills[L.id] = store.drills[L.id] || [])[k] = true; save();
      q("data-feed").innerHTML = '<div class="okbox"><h4>Drill passed</h4><p>' + (D.cases.length > 1 ? "All " + D.cases.length + " tests pass. " : "") + (k < n - 1 ? "On to the next drill." : "Every drill is done, so the challenge is unlocked.") + "</p></div>";
      status(); if (first) Sound.chime(); onPass();
    } else {
      q("data-feed").innerHTML = '<div class="errbox"><p>' + failMessage(ev, D) + "</p>" + (hintsShown < D.hints.length ? '<p class="small">Stuck? Press "Show a hint".</p>' : "") + "</div>";
    }
  }
  $('[data-a="check"]', host).onclick = check;
  $('[data-a="hint"]', host).onclick = () => { hintsShown++; drawHints(); };
  $('[data-a="reset"]', host).onclick = () => { ed.set(D.starter); q("data-feed").innerHTML = ""; q("data-out").innerHTML = ""; grid && grid.reset(); };
  status(); drawHints();
}

    const norm = s => s.split("\n").map(x => x.trim()).filter(Boolean).join("\n");
    const ok = norm($("#pred", host).value) === norm(L.predict.answer);
    $("#pres", host).innerHTML = '<div class="' + (ok ? "okbox" : "errbox") + '"><b>' + (ok ? "Correct." : "Not quite. The output is:") + "</b>" + (ok ? "" : '<pre class="console">' + esc(L.predict.answer) + "</pre>") + "<p>" + esc(L.predict.explain) + "</p></div>";
  };
  gate();
}

/* ---- Stage 4: Challenge ---- */
function stageChallenge(host, L, idx) {
  if (!drillsDone(L)) {
    host.innerHTML = '<div class="panel"><h3>Challenge locked</h3><p>Finish the guided drills in Practise first. They cover exactly what this repair needs.</p>' + nextBtn("Go to the drills", 2) + "</div>";
    wireGoto(host); return;
  }
  const C = L.challenge, key = L.id + ":c", S = sess(L.id), done = store.done[L.id];
  const budget = HINT_BUDGET(idx);
  host.innerHTML = '<div class="stack-lg">' +
    '<div class="cols"><div class="brief brief-lg"><p class="eyebrow">Repair order</p><p>' + C.brief + "</p></div>" +
    '<div class="scene"><div class="scene-head"><span>' + esc(C.title) + '</span><span class="state-lamp" id="lamp"><i></i><span>Offline</span></span></div><div id="scene"></div></div></div>' +
    '<div class="panel"><h3>Your code</h3><div id="ced"></div><div class="toolbar"><button class="btn" id="crun">Run ▶</button><button class="btn primary" id="ccheck">Check solution</button><button class="btn small" id="creset">Reset</button><span class="hint-k">Ctrl + Enter checks</span></div>' +
    '<div id="cfeed" aria-live="polite" style="margin-top:16px"></div><div id="cout" style="margin-top:16px"></div></div>' +
    '<div class="cols"><div class="panel"><h3>Test results</h3><div class="scroll-x"><table class="cases"><thead><tr><th>Test</th><th>Expected</th><th>Result</th></tr></thead><tbody id="cases"></tbody></table></div></div>' +
    '<div class="panel"><h3>Hints</h3><p class="muted small" style="margin-bottom:12px">' + budget + " hint" + (budget === 1 ? "" : "s") + " for this repair. Hints get scarcer as you go deeper into the station. Using one lowers the stars you can earn.</p><div class=\"hints\" id=\"hints\"></div><div class=\"toolbar\"><button class=\"btn small\" id=\"hintbtn\"></button><span id=\"revealwrap\"></span></div></div></div>" +
    "</div>";
  const ed = createEditor($("#ced", host), { value: store.drafts[key] ?? C.starter, id: "ed-" + L.id + "-c", minLines: 10, onRun: () => check(), onChange: v => { store.drafts[key] = v; save(); } });
  const sceneHost = $("#scene", host);
  let grid = null;
  function drawScene(state) {
    const on = state && state.pass;
    $("#lamp", host).className = "state-lamp" + (on ? " on" : "");
    $("#lamp span", host).textContent = on ? "Online" : "Offline";
    if (C.scene === "robot") { if (!grid) grid = mountGrid(sceneHost, C.cases[0].map, C.cases[0].dir); return; }
    if (C.scene === "terminal") { const lines = state && state.logs && state.logs.length ? esc(state.logs.join("\n")) : '<span class="dim">_ waiting for output…</span>'; sceneHost.innerHTML = '<div class="crt">' + lines + (on ? '\n\n<span>&gt; ACCESS GRANTED</span>' : "") + "</div>"; return; }
    if (C.scene === "door") { const code = state && state.report && state.report.doorCode !== undefined ? show(state.report.doorCode) : "----"; sceneHost.innerHTML = '<div class="doorframe' + (on ? " open" : "") + '"><div class="behind">VAULT OPEN</div><div class="leaf l"></div><div class="leaf r"></div><div class="keypad">doorCode: ' + esc(code) + "</div></div>"; return; }
    const n = C.cases.length, p = state && state.passed !== undefined ? state.passed : 0;
    sceneHost.innerHTML = '<div class="crt" style="min-height:0">' + (state ? (on ? "ALL " + n + " CHECKS PASSED\n&gt; machine restored" : p + " / " + n + " checks passing\n&gt; repair incomplete") : '<span class="dim">' + n + " test rigs connected. Run a check to power them.</span>") + "</div>";
  }
  function drawCases(results) {
    $("#cases", host).innerHTML = C.cases.map((c, i) => {
      const r = results && results[i];
      return "<tr><td><code>" + esc(c.label) + "</code></td><td><code>" + esc(c.expect) + "</code></td><td>" + (r ? '<span class="res ' + (r.ok ? "ok" : "bad") + '">' + (r.ok ? "Pass" : "Fail") + "</span>" + (r.got !== undefined && !r.ok ? '<br><code class="small">' + esc(r.got) + "</code>" : "") : '<span class="res wait">Not run</span>') + "</td></tr>";
    }).join("");
  }
  function drawHints() {
    $("#hints", host).innerHTML = C.hints.slice(0, S.hints).map((t, i) => '<div class="hint"><b>Hint ' + (i + 1) + ".</b> " + t + "</div>").join("");
    const b = $("#hintbtn", host);
    b.textContent = S.hints < budget ? "Show hint " + (S.hints + 1) + " of " + budget : "No hints left";
    b.disabled = S.hints >= budget;
    const rw = $("#revealwrap", host);
    if (S.revealed) rw.innerHTML = '<div style="margin-top:10px"><span class="label">Worked solution</span>' + codeBlock(C.solution) + '<p class="muted small" style="margin-top:6px">Read it line by line, then type or adapt it yourself and check again. Revealing the solution caps this repair at 1 star.</p></div>';
    else if (S.fails >= 3) { rw.innerHTML = '<button class="btn small" id="reveal">Show a worked solution (max 1 star)</button>'; $("#reveal", host).onclick = () => { S.revealed = true; save(); drawHints(); }; }
    else rw.innerHTML = "";
  }
  $("#hintbtn", host).onclick = () => { if (S.hints < budget) { S.hints++; save(); drawHints(); } };
  $("#creset", host).onclick = () => { ed.set(C.starter); };
  async function run() {
    const c = C.cases[0];
    $("#cout", host).innerHTML = '<p class="muted small">Running…</p>';
    const r = await runOnce({ code: ed.get(), pre: c.pre || "", map: c.map || null, dir: c.dir });
    renderResult($("#cout", host), r, ed);
    if (grid && r.robot) grid.play(r.robot.trace);
    if (C.scene === "terminal") drawScene({ logs: r.logs });
  }
  async function check() {
    const code = ed.get();
    $("#cfeed", host).innerHTML = '<p class="muted small">Checking ' + C.cases.length + " test" + (C.cases.length > 1 ? "s" : "") + "…</p>";
    S.attempts++;
    const ev = await evaluate(code, C);
    const { runs, results, showIdx, passed, allOk } = ev;
    renderResult($("#cout", host), runs[showIdx], ed);
    if (C.cases.length > 1) $("#cout", host).insertAdjacentHTML("afterbegin", '<p class="muted small" style="margin-bottom:4px">Showing output from test: <code>' + esc(C.cases[showIdx].label) + "</code></p>");
    if (grid) { grid = mountGrid(sceneHost, C.cases[showIdx].map, C.cases[showIdx].dir); if (runs[showIdx].robot) grid.play(runs[showIdx].robot.trace); }
    drawCases(results);
    drawScene({ pass: allOk, logs: runs[0].logs, report: runs[0].report, passed });
    if (allOk) {
      const stars = S.revealed ? 1 : (S.hints === 0 && S.attempts <= 2) ? 3 : (S.hints <= 1 && S.attempts <= 4) ? 2 : 1;
      const prev = store.done[L.id];
      const best = Math.max(stars, prev ? prev.stars : 0);
      store.done[L.id] = { stars: best, code };
      store.sess[L.id] = { attempts: 0, hints: 0, revealed: false, fails: 0 };
      Object.assign(S, store.sess[L.id]);
      save(); renderStatus(); celebrate();
      $("#cfeed", host).innerHTML = '<div class="okbox"><h4>Machine repaired</h4><span class="stars-big" aria-label="' + stars + ' of 3 stars">' + "★".repeat(stars) + "☆".repeat(3 - stars) + "</span><p>" + (stars === 3 ? "Clean repair: no hints and hardly any retries." : stars === 2 ? "Solid work. Solve it with no hints and at most 2 checks for 3 stars." : "Repaired. Replay later without hints to earn more stars.") + (prev && prev.stars > stars ? " Your best of " + prev.stars + " stars is kept." : "") + '</p><div class="toolbar"><button class="btn primary" id="toreview">See why it works →</button></div></div>';
      $("#toreview", host).onclick = () => { view.stage = 4; render(); window.scrollTo({ top: 0 }); };
      $$('.stage-tab', app)[4].disabled = false; $$('.stage-tab', app)[3].classList.add("ok");
    } else {
      S.fails++; save();
      $("#cfeed", host).innerHTML = '<div class="errbox"><p>' + failMessage(ev, C) + "</p>" + (S.fails >= 3 && !S.revealed ? '<p class="small">Stuck? You can reveal a worked solution in the hints panel.</p>' : "") + "</div>";
      drawHints();
    }
  }
  $("#crun", host).onclick = run;
  $("#ccheck", host).onclick = check;
  drawScene(done ? { pass: true, passed: C.cases.length, logs: [] } : null);
  drawCases(null); drawHints();
  if (done) $("#cfeed", host).innerHTML = '<div class="okbox"><p><b>Already repaired with ' + done.stars + " star" + (done.stars > 1 ? "s" : "") + ".</b> You can solve it again to improve your score, or continue to the review.</p></div>";
}

/* ---- Stage 5: Review ---- */
function stageReview(host, L, idx) {
  const d = store.done[L.id], C = L.challenge;
  if (!d) { host.innerHTML = '<div class="panel"><p>Repair the machine in the Challenge stage to unlock the review.</p>' + nextBtn("Go to the challenge", 3) + "</div>"; wireGoto(host); return; }
  const next = LESSONS[idx + 1];
  const solLines = C.solution.split("\n");
  host.innerHTML = '<div class="cols"><div class="stack"><div class="okbox"><h4>' + esc(C.title) + ': complete</h4><span class="stars-big">' + "★".repeat(d.stars) + "☆".repeat(3 - d.stars) + '</span><p>+' + (100 + 25 * d.stars) + ' XP toward your rank.</p></div>' +
    '<div class="panel"><h3>Your solution</h3>' + codeBlock(d.code) + '<p class="muted small" style="margin-top:8px">Your version doesn\'t have to match the model below. If every test passed, it works. Compare the two to see other ways of writing the same idea.</p></div>' +
    '<div class="panel"><h3>What you learned</h3><ul class="mistakes">' + L.recap.map(r => "<li>" + r + "</li>").join("") + "</ul></div></div>" +
    '<div class="stack"><div class="panel"><h3>Why the model solution works</h3><div class="scroll-x"><table class="explain"><tbody>' + solLines.map((ln, i) => "<tr><td>" + (hl(ln) || " ") + "</td><td>" + esc(C.why[i] || "") + "</td></tr>").join("") + "</tbody></table></div></div>" +
    '<div class="panel"><h3>Watch out for</h3><ul class="mistakes">' + L.mistakes.slice(0, 2).map(m => "<li>" + m + "</li>").join("") + "</ul></div></div></div>" +
    '<div class="next-row"><button class="btn" id="tomap">Station map</button>' + (next ? '<button class="btn primary" id="tonext">Next: ' + esc(next.title) + " →</button>" : '<span class="pill ok" style="align-self:center">Station fully repaired</span>') + "</div>";
  $("#tomap", host).onclick = () => go({ name: "map" });
  const tn = $("#tonext", host); if (tn) tn.onclick = () => go({ name: "lesson", i: idx + 1, stage: 0 });
}

render();
</script>

</html>
